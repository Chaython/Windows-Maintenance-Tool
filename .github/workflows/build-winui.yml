name: Build WinUI 3 Artifact

on:
  push:
    branches: [main, master, Main, WinUi]
  pull_request:
    branches: [main, master, Main, WinUi]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-winui:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BuildConfiguration: Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup MSBuild (Visual Studio Build Tools)
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages (MSBuild)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          msbuild "WMT-WinUI\WMT-WinUI.sln" -t:Restore -p:Configuration=$env:BuildConfiguration -verbosity:quiet

      - name: Build WinUI 3 App (MSBuild)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # MSBuild hooks the Windows App SDK targets correctly on windows-latest,
          # generating .g.cs (App.g.i.cs, MainWindow.g.cs, etc.) without MSIX conflicts.
          msbuild "WMT-WinUI\WMT-WinUI.sln" -p:Configuration=$env:BuildConfiguration -verbosity:normal -t:Rebuild

      - name: Copy build artifacts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = "WMT-WinUI\WMT-WinUI\bin\Release\net9.0-windows10.0.19041.0\win-x64"
          if (-not (Test-Path $outDir)) {
            $outDir = "WMT-WinUI\WMT-WinUI\bin\Release\net9.0-windows10.0.19041.0"
          }
          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null
          Copy-Item -Path "$outDir\*" -Destination "artifacts\" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Artifacts copied from $outDir"

      - name: Upload WinUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: winui-3-artifact
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn

      - name: Verify PowerShell engine
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $enginePath = "WMT-WinUI\WMT-Engine.psm1"
          if (Test-Path $enginePath) {
            $content = Get-Content $enginePath -Raw
            $lineCount = $content.Split([Environment]::NewLine).Count
            Write-Host "Engine module loaded: $lineCount lines"
            $temp = $content -replace '#Requires -RunAsAdministrator', ''
            $temp | Out-File -FilePath ".\temp_engine.ps1" -Encoding UTF8 -NoNewline
            Import-Module ".\temp_engine.ps1" -Force -ErrorAction SilentlyContinue
            if (Get-Command Get-WmtVersion -ErrorAction SilentlyContinue) {
              Write-Host "Engine version: $(Get-WmtVersion)"
            }
          } else {
            Write-Warning "WMT-Engine.psm1 not found at expected path"
          }
