          if ($script:MockDisabledFeature -or $script:MockEnabledFeature) {
              throw 'An unknown optional-feature state changed the system.'
          }
          Write-Host 'PASS: pending feature and capability toggles dispatch safely and unknown states are inert.'

          # Exercise the real scan worker with mocked Windows capability cmdlets.
          $scanFunction = Find-FunctionText 'Start-OptionalFeaturesBackgroundCheck'
          $scanTokens = $null; $scanErrors = $null
          $scanAst = [System.Management.Automation.Language.Parser]::ParseInput($scanFunction, [ref]$scanTokens, [ref]$scanErrors)
          if ($scanErrors.Count) { throw ($scanErrors.Message -join '; ') }
          $addScript = $scanAst.Find({
