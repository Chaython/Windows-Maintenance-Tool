          if (-not $script:OptionalFeaturesReady -or
              $script:OptionalFeaturesCheckStarted -or
              $script:OptionalFeaturePendingCache['btnFeatXPS'] -ne 'InstallPending' -or
              $script:OptionalFeatureStateCache['btnFeatXPS'] -ne $true) {
              throw 'The completion callback did not publish the pending capability state.'
          }
          $script:MockCapabilityState = 'SomethingNew'
          $script:MockScanResult = @(& $scanBlock $featureMap)
          $script:FeaturesCheckPS = $fakeScanPs
          $script:FeaturesCheckAsync = [pscustomobject]@{ IsCompleted = $true }
          & $onTick
          if (-not $script:OptionalFeaturesReady -or
              $script:OptionalFeatureStateCache['btnFeatXPS'] -ne $true -or
              -not $script:OptionalFeatureUnknownCache.ContainsKey('btnFeatXPS') -or
              -not (@($script:MockLogs) -match 'last verified state retained')) {
              throw 'The completion callback did not retain and warn about the last verified state.'
          }
          Write-Host 'PASS: the production completion callback publishes pending state and retains unknown-state snapshots.'

          # The result contract must reject contradictory or incomplete scans.
          Invoke-Expression (Find-FunctionText 'Test-WmtOptionalFeatureScanResult')
          $validButtons = @('btnFeatHyperV', 'btnFeatXPS')
          $script:MockCapabilityState = 'InstallPending'
          $result = & $scanBlock $featureMap
          if (-not (Test-WmtOptionalFeatureScanResult -Result $result -ValidButtons $validButtons)) {
              throw 'A valid pending-state scan result was rejected.'
          }
          $invalidResults = @(
              @{ Label = 'pending without a state'; Expected = 'contradictory pending-state data';
                 Result = @{ States = @{ 'btnFeatHyperV' = $true }; Providers = @{ 'btnFeatHyperV' = @{ Type = 'Feature'; Name = 'Microsoft-Hyper-V-All' } }; Unavailable = @{ 'btnFeatXPS' = 'Unavailable feature' }; Pending = @{ 'btnFeatXPS' = 'InstallPending' }; Unknown = @{} } },
              @{ Label = 'pending for an unknown button'; Expected = 'contradictory pending-state data';
                 Result = @{ States = @{ 'btnFeatHyperV' = $true; 'btnFeatXPS' = $true }; Providers = @{ 'btnFeatHyperV' = @{ Type = 'Feature'; Name = 'Microsoft-Hyper-V-All' }; 'btnFeatXPS' = @{ Type = 'Capability'; Name = 'XPS.Viewer~~~~0.0.1.0' } }; Unavailable = @{}; Pending = @{ 'btnFeatNope' = 'InstallPending' }; Unknown = @{} } },
              @{ Label = 'missing pending map'; Expected = 'Scan result type is invalid';
                 Result = @{ States = @{ 'btnFeatHyperV' = $true }; Providers = @{ 'btnFeatHyperV' = @{ Type = 'Feature'; Name = 'Microsoft-Hyper-V-All' } }; Unavailable = @{ 'btnFeatXPS' = 'Unavailable feature' }; Unknown = @{} } },
              @{ Label = 'unknown pending marker'; Expected = 'unknown pending-state marker';
                 Result = @{ States = @{ 'btnFeatHyperV' = $true; 'btnFeatXPS' = $true }; Providers = @{ 'btnFeatHyperV' = @{ Type = 'Feature'; Name = 'Microsoft-Hyper-V-All' }; 'btnFeatXPS' = @{ Type = 'Capability'; Name = 'XPS.Viewer~~~~0.0.1.0' } }; Unavailable = @{}; Pending = @{ 'btnFeatXPS' = 'SomethingPending' }; Unknown = @{} } },
              @{ Label = 'pending outcome contradicts the state'; Expected = 'contradicts the displayed outcome';
                 Result = @{ States = @{ 'btnFeatHyperV' = $true; 'btnFeatXPS' = $false }; Providers = @{ 'btnFeatHyperV' = @{ Type = 'Feature'; Name = 'Microsoft-Hyper-V-All' }; 'btnFeatXPS' = @{ Type = 'Capability'; Name = 'XPS.Viewer~~~~0.0.1.0' } }; Unavailable = @{}; Pending = @{ 'btnFeatXPS' = 'InstallPending' }; Unknown = @{} } },
              @{ Label = 'unknown state overlaps a verified state'; Expected = 'contradictory unrecognized-state data';
                 Result = @{ States = @{ 'btnFeatHyperV' = $true; 'btnFeatXPS' = $true }; Providers = @{ 'btnFeatHyperV' = @{ Type = 'Feature'; Name = 'Microsoft-Hyper-V-All' }; 'btnFeatXPS' = @{ Type = 'Capability'; Name = 'XPS.Viewer~~~~0.0.1.0' } }; Unavailable = @{}; Pending = @{}; Unknown = @{ 'btnFeatXPS' = 'Unknown state' } } },
              @{ Label = 'null provider'; Expected = 'invalid feature provider';
                 Result = @{ States = @{ 'btnFeatHyperV' = $true; 'btnFeatXPS' = $false }; Providers = @{ 'btnFeatHyperV' = @{ Type = 'Feature'; Name = 'Microsoft-Hyper-V-All' }; 'btnFeatXPS' = $null }; Unavailable = @{}; Pending = @{}; Unknown = @{} } },
              @{ Label = 'string state'; Expected = 'invalid feature state';
                 Result = @{ States = @{ 'btnFeatHyperV' = 'false'; 'btnFeatXPS' = $false }; Providers = @{ 'btnFeatHyperV' = @{ Type = 'Feature'; Name = 'Microsoft-Hyper-V-All' }; 'btnFeatXPS' = @{ Type = 'Capability'; Name = 'XPS.Viewer~~~~0.0.1.0' } }; Unavailable = @{}; Pending = @{}; Unknown = @{} } },
              @{ Label = 'incomplete classification'; Expected = 'features were classified';
                 Result = @{ States = @{ 'btnFeatHyperV' = $true }; Providers = @{ 'btnFeatHyperV' = @{ Type = 'Feature'; Name = 'Microsoft-Hyper-V-All' } }; Unavailable = @{}; Pending = @{}; Unknown = @{} } }
          )
          foreach ($case in $invalidResults) {
              $rejected = $false
              $errorMessage = ''
              try { [void](Test-WmtOptionalFeatureScanResult -Result $case.Result -ValidButtons $validButtons) }
              catch { $rejected = $true; $errorMessage = $_.Exception.Message }
              if (-not $rejected) {
                  throw "A contradictory scan result was accepted: $($case.Label)."
              }
              if ($errorMessage -notmatch [regex]::Escape($case.Expected)) {
                  throw "The '$($case.Label)' fixture failed for the wrong reason: $errorMessage"
              }
          }
          Write-Host 'PASS: contradictory and incomplete scan results are rejected for the intended reason.'

          # Verify that pending results reach the UI cache and are rendered as
          # pending-restart states rather than plain on/off labels.
          Invoke-Expression (Find-FunctionText 'Update-SingleFeatureButtonState')
          Invoke-Expression (Find-FunctionText 'Update-WmtQuickFindStateLabels')
          $script:MockFeatureButton = [pscustomobject]@{
              IsEnabled = $false
              ToolTip = ''
              Style = $null
          }
          function Get-Ctrl { param([string]$Name) return $script:MockFeatureButton }
          $window = [pscustomobject]@{}
          $window | Add-Member -MemberType ScriptMethod -Name FindResource -Value {
              param($Name)
              if ($Name -eq 'AccentBtn') { return 'AccentStyle' }
              return 'ActionStyle'
          }
          $script:OptionalFeaturesReady = $true
          $script:OptionalFeatureStateCache = @{ 'btnFeatXPS' = $true }
          $script:OptionalFeatureUnavailableCache = @{}
          $script:OptionalFeatureProviderCache = @{
              'btnFeatXPS' = @{ Type = 'Capability'; Name = 'XPS.Viewer~~~~0.0.1.0' }
          }
          $script:OptionalFeaturePendingCache = @{ 'btnFeatXPS' = 'InstallPending' }
          $script:OptionalFeatureUnknownCache = @{}
          Update-SingleFeatureButtonState -ButtonName 'btnFeatXPS' -FeatureName ''
          if (-not $script:MockFeatureButton.IsEnabled -or
              $script:MockFeatureButton.ToolTip -notmatch 'Install pending restart') {
              throw 'The native optional-feature button did not render the InstallPending state.'
          }
          $script:OptionalFeatureStateCache['btnFeatXPS'] = $false
          $script:OptionalFeaturePendingCache['btnFeatXPS'] = 'DisablePending'
          Update-SingleFeatureButtonState -ButtonName 'btnFeatXPS' -FeatureName ''
          if ($script:MockFeatureButton.ToolTip -notmatch 'Disable pending restart') {
              throw 'The native optional-feature button did not render the DisablePending state.'
          }
          $script:OptionalFeatureUnknownCache['btnFeatXPS'] = 'Unrecognized capability state'
          Update-SingleFeatureButtonState -ButtonName 'btnFeatXPS' -FeatureName ''
          if ($script:MockFeatureButton.ToolTip -notmatch 'WARNING: Unrecognized capability state') {
              throw 'The native optional-feature button did not surface the retained-state warning.'
          }
          $pnlQuickFind = [pscustomobject]@{ IsVisible = $true }
          $script:WmtQuickFindStateLabels = @{
              'btnFeatXPS' = [pscustomobject]@{ Text = '' }
          }
          $script:OptionalFeaturePendingCache['btnFeatXPS'] = 'InstallPending'
          Update-WmtQuickFindStateLabels
          if ($script:WmtQuickFindStateLabels['btnFeatXPS'].Text -notmatch 'Pending restart \(will be enabled\)') {
              throw 'Quick Find did not render the InstallPending outcome.'
          }
          $script:OptionalFeaturePendingCache['btnFeatXPS'] = 'DisablePending'
          Update-WmtQuickFindStateLabels
          if ($script:WmtQuickFindStateLabels['btnFeatXPS'].Text -notmatch 'Pending restart \(will be disabled\)') {
              throw 'Quick Find did not render the DisablePending outcome.'
          }
          Write-Host 'PASS: pending states reach the UI cache and render restart-aware labels.'

      - name: Smoke test optional-feature retry and timeout lifecycle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          function Find-FunctionText([string]$name) {
              $node = $ast.Find({
                  param($n)
                  $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name
              }, $true)
              if (-not $node) { throw "Missing function: $name" }
              return $node.Extent.Text
          }
          function Find-FunctionAst([string]$name) {
              $node = $ast.Find({
                  param($n)
                  $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name
              }, $true)
              if (-not $node) { throw "Missing function: $name" }
              return $node
          }
          Invoke-Expression (Find-FunctionText 'Test-WmtOptionalFeatureScanResult')
          Invoke-Expression (Find-FunctionText 'Merge-WmtOptionalFeatureScanResult')

          # Extract the production completion and timeout callbacks rather
          # than duplicating their state transitions in the test.
          $scanAst = Find-FunctionAst 'Start-OptionalFeaturesBackgroundCheck'
          $registerCall = $scanAst.Find({
              param($node)
              $node -is [System.Management.Automation.Language.CommandAst] -and
                  $node.GetCommandName() -eq 'Register-WmtUiPollOperation'
          }, $true)
          if (-not $registerCall) { throw 'Optional-feature poll registration was not found.' }
          $onTickIndex = -1
          $registerElements = @($registerCall.CommandElements)
          for ($i = 0; $i -lt $registerElements.Count; $i++) {
              if ($registerElements[$i] -is [System.Management.Automation.Language.CommandParameterAst] -and
                  $registerElements[$i].ParameterName -eq 'OnTick') {
                  $onTickIndex = $i + 1
                  break
              }
          }
          if ($onTickIndex -le 0 -or $onTickIndex -ge $registerElements.Count) {
              throw 'Optional-feature completion callback was not found.'
          }
          $onTickText = $registerElements[$onTickIndex].Extent.Text
          $onTick = [scriptblock]::Create($onTickText.Substring(1, $onTickText.Length - 2))
          $timeoutTick = $scanAst.Find({
              param($node)
              $node -is [System.Management.Automation.Language.InvokeMemberExpressionAst] -and
                  $node.Member.Value -eq 'Add_Tick' -and
                  $node.Extent.Text -match 'Optional-feature detection timed out'
          }, $true)
          if (-not $timeoutTick -or $timeoutTick.Arguments.Count -ne 1) {
              throw 'Optional-feature timeout callback was not found.'
          }
          $timeoutText = $timeoutTick.Arguments[0].Extent.Text
          $timeoutCallback = [scriptblock]::Create($timeoutText.Substring(1, $timeoutText.Length - 2))

          $script:MockLogs = @()
          $script:MockErrors = @()
          $script:MockStopCalls = @()
          $script:MockUnregisterCalls = @()
          $script:MockRetryStartCount = 0
          function Write-GuiLog { param([string]$Message) $script:MockLogs += $Message }
          function Show-TweakStatesLoadError { param([string]$Message) $script:MockErrors += $Message }
          function Sync-WmtOptionalFeatureButtons { }
          function Sync-WmtTweakOverlayHide { }
          function Sync-WmtQuickFindStateAvailability { }
          function Unregister-WmtUiPollOperation {
              param([string]$Name)
              $script:MockUnregisterCalls += $Name
          }
          function Stop-WmtPowerShellInvocationAsync {
              param($PowerShell, $Invocation, [string]$Name)
              $script:MockStopCalls += $Name
          }
          function Start-WmtPowerShellCleanupDetached {
              param($PowerShell, $Invocation, [string]$Name)
              $script:MockStopCalls += $Name
          }

          # A worker-pool startup failure must clear the running flag, remain
          # fail-closed, and leave the scan retryable with an actionable error.
          Invoke-Expression (Find-FunctionText 'Start-OptionalFeaturesBackgroundCheck')
          function New-WmtPooledPowerShell { param([string]$PoolKind) throw 'simulated worker creation failure' }
          $script:OptionalFeaturesReady = $false
          $script:OptionalFeaturesCheckStarted = $false
          $script:FeaturesPoolRetryTimer = $null
          Start-OptionalFeaturesBackgroundCheck
          if ($script:OptionalFeaturesReady -or $script:OptionalFeaturesCheckStarted -or
              -not (@($script:MockErrors) -match 'Could not start optional-feature background worker')) {
              throw 'Optional-feature worker startup failure did not remain fail-closed and retryable.'
          }

          # A failure while attaching the production script must roll back the
          # worker and clear the running flag instead of stranding retries.
          $script:MockErrors = @()
          $script:MockDisposeCount = 0
          $fakeSetupPs = [pscustomobject]@{}
          $fakeSetupPs | Add-Member -MemberType ScriptMethod -Name AddScript -Value {
              throw 'simulated script setup failure'
          }
          $fakeSetupPs | Add-Member -MemberType ScriptMethod -Name Dispose -Value {
              $script:MockDisposeCount++
          }
          function New-WmtPooledPowerShell { param([string]$PoolKind) return $fakeSetupPs }
          $script:OptionalFeaturesReady = $false
          $script:OptionalFeaturesCheckStarted = $false
          $script:FeaturesCheckPS = $null
          $script:FeaturesCheckAsync = $null
          $script:FeaturesCheckTimeout = $null
          Start-OptionalFeaturesBackgroundCheck
          if ($script:OptionalFeaturesReady -or $script:OptionalFeaturesCheckStarted -or
              $script:MockDisposeCount -ne 1 -or
              -not (@($script:MockErrors) -match 'Optional-feature scan could not start') -or
              -not (@($script:MockErrors) -match 'simulated script setup failure')) {
              throw 'Optional-feature script setup failure did not roll back and remain retryable.'
          }

          # Registration can fail after the invocation starts. The setup
          # transaction must stop that invocation and clear the retry guard.
          $script:MockErrors = @()
          $script:MockStopCalls = @()
          $script:MockUnregisterCalls = @()
          $fakeRegisterPs = [pscustomobject]@{}
          $fakeRegisterPs | Add-Member -MemberType ScriptMethod -Name AddScript -Value { param($ScriptBlock) }
          $fakeRegisterPs | Add-Member -MemberType ScriptMethod -Name AddArgument -Value { param($Argument) }
          $fakeRegisterPs | Add-Member -MemberType ScriptMethod -Name BeginInvoke -Value {
              return [pscustomobject]@{ IsCompleted = $false }
          }
          $fakeRegisterPs | Add-Member -MemberType ScriptMethod -Name Dispose -Value { }
          function New-WmtPooledPowerShell { param([string]$PoolKind) return $fakeRegisterPs }
          function Register-WmtUiPollOperation { throw 'simulated monitor registration failure' }
          $script:OptionalFeaturesReady = $false
          $script:OptionalFeaturesCheckStarted = $false
          $script:FeaturesCheckPS = $null
          $script:FeaturesCheckAsync = $null
          $script:FeaturesCheckTimeout = $null
          Start-OptionalFeaturesBackgroundCheck
          if ($script:OptionalFeaturesReady -or $script:OptionalFeaturesCheckStarted -or
              $null -ne $script:FeaturesCheckPS -or $null -ne $script:FeaturesCheckAsync -or
              -not (@($script:MockStopCalls) -match 'Optional feature setup rollback') -or
              @($script:MockUnregisterCalls) -contains 'OptionalFeaturesCheck' -or
              -not (@($script:MockErrors) -match 'simulated monitor registration failure')) {
              throw 'Optional-feature monitor registration failure did not roll back and remain retryable.'
          }

          # The retry handler must preserve the last verified state, provider,
          # and pending marker while discarding stale unavailable/unknown data.
          Invoke-Expression (Find-FunctionText 'Show-TweakStatesLoadError')
          $script:MockRetryHandler = $null
          $retryButton = [pscustomobject]@{ Visibility = 'Collapsed' }
          $retryButton | Add-Member -MemberType ScriptMethod -Name Add_Click -Value {
              param($Handler)
              $script:MockRetryHandler = $Handler
          }
          function Get-Ctrl {
              param([string]$Name)
              if ($Name -eq 'btnTweakOverlayRetry') { return $retryButton }
              return $null
          }
          function Set-TweakStatesLoadingOverlay { param([bool]$Visible, [string]$ErrorMessage = '') }
          function Start-OptionalFeaturesBackgroundCheck { $script:MockRetryStartCount++ }
          $script:MockTweakStartCount = 0
          function Start-TweakButtonStatesBackgroundUpdate {
              $script:MockTweakStartCount++
              $script:TweakStatesBgStarted = $true
          }
          $script:TweakOverlayRetryWired = $false
          $script:TweakStatesReady = $true
          $script:OptionalFeaturesReady = $false
          $script:OptionalFeaturesCheckStarted = $true
          $script:WmtTweakLoadError = ''
          $script:OptionalFeatureStateCache = @{ 'btnFeatXPS' = $false }
          $script:OptionalFeatureProviderCache = @{
              'btnFeatXPS' = @{ Type = 'Capability'; Name = 'XPS.Viewer~~~~0.0.1.0' }
          }
          $script:OptionalFeaturePendingCache = @{ 'btnFeatXPS' = 'DisablePending' }
          $script:OptionalFeatureUnavailableCache = @{ 'btnFeatXPS' = 'stale unavailable reason' }
          $script:OptionalFeatureUnknownCache = @{ 'btnFeatXPS' = 'stale unknown reason' }
          $script:FeaturesCheckTimeout = $null
          $script:FeaturesCheckPS = [pscustomobject]@{ OldWorker = $true }
          $script:FeaturesCheckAsync = [pscustomobject]@{ IsCompleted = $false }
          Show-TweakStatesLoadError -Message 'simulated optional-feature failure'
          if (-not ($script:MockRetryHandler -is [scriptblock])) {
              throw 'The optional-feature error did not wire the retry handler.'
          }
          & $script:MockRetryHandler
          if ($script:OptionalFeaturesReady -or $script:OptionalFeaturesCheckStarted -or
              $script:MockRetryStartCount -ne 1 -or
              $script:OptionalFeatureStateCache['btnFeatXPS'] -ne $false -or
              $script:OptionalFeatureProviderCache['btnFeatXPS'].Name -ne 'XPS.Viewer~~~~0.0.1.0' -or
              $script:OptionalFeaturePendingCache['btnFeatXPS'] -ne 'DisablePending' -or
              $script:OptionalFeatureUnavailableCache.ContainsKey('btnFeatXPS') -or
              $script:OptionalFeatureUnknownCache.ContainsKey('btnFeatXPS') -or
              -not (@($script:MockStopCalls) -match 'Optional features retry')) {
              throw 'The optional-feature retry did not preserve the last verified snapshot safely.'
          }

          # If the tweak-state worker is still live, the shared retry must stop
          # and unregister it before starting its replacement so the old
          # callback cannot consume the replacement's shared handles.
          $script:MockRetryStartCount = 0
          $script:MockTweakStartCount = 0
          $script:MockStopCalls = @()
          $script:MockUnregisterCalls = @()
          $liveTweakPs = [pscustomobject]@{ LiveTweakWorker = $true }
          $liveTweakAsync = [pscustomobject]@{ IsCompleted = $false }
          $script:TweakStatesReady = $false
          $script:TweakStatesBgStarted = $true
          $script:TweakStatesBgPS = $liveTweakPs
          $script:TweakStatesBgAsync = $liveTweakAsync
          $script:TweakStatesBgTimeout = $null
          $script:OptionalFeaturesReady = $false
          $script:OptionalFeaturesCheckStarted = $true
          $script:FeaturesCheckTimeout = $null
          $script:FeaturesCheckPS = [pscustomobject]@{ FeatureWorker = $true }
          $script:FeaturesCheckAsync = [pscustomobject]@{ IsCompleted = $false }
          & $script:MockRetryHandler
          if ($script:MockTweakStartCount -ne 1 -or
              $null -ne $script:TweakStatesBgPS -or
              $null -ne $script:TweakStatesBgAsync -or
              $script:MockRetryStartCount -ne 1 -or
              -not $script:TweakStatesBgStarted -or
              -not (@($script:MockUnregisterCalls) -contains 'TweakStatesLoad') -or
              -not (@($script:MockStopCalls) -match 'Tweak state preload retry')) {
              throw 'The shared retry orphaned a live tweak-state worker or raced its replacement.'
          }

          # A genuinely failed tweak scan (no live worker) must still start one
          # replacement when the user retries.
          $script:MockTweakStartCount = 0
          $script:TweakStatesReady = $false
          $script:TweakStatesBgStarted = $false
          $script:TweakStatesBgPS = $null
          $script:TweakStatesBgAsync = $null
          $script:OptionalFeaturesReady = $true
          & $script:MockRetryHandler
          if ($script:MockTweakStartCount -ne 1) {
              throw 'The shared retry did not restart a genuinely failed tweak-state scan.'
          }

          # A later unfamiliar state must fall back to the snapshot retained by
          # the retry and publish a warning without becoming a false/true state.
          $script:OptionalFeaturesMap = @{
              'Microsoft-Hyper-V-All' = 'btnFeatHyperV'
              'XpsViewer' = 'btnFeatXPS'
          }
          $script:MockRawResult = @(@{
              States = @{ 'btnFeatHyperV' = $true }
              Providers = @{ 'btnFeatHyperV' = @{ Type = 'Feature'; Name = 'Microsoft-Hyper-V-All' } }
              Unavailable = @{}
              Pending = @{}
              Unknown = @{ 'btnFeatXPS' = "Unrecognized capability state 'FutureState' for XpsViewer" }
          })
          $fakeScanPs = [pscustomobject]@{}
          $fakeScanPs | Add-Member -MemberType ScriptMethod -Name EndInvoke -Value {
              param($Invocation)
              $result = @($script:MockRawResult)
              Write-Output -NoEnumerate $result
          }
          $fakeScanPs | Add-Member -MemberType ScriptMethod -Name Dispose -Value { }
          $script:FeaturesCheckPS = $fakeScanPs
          $script:FeaturesCheckAsync = [pscustomobject]@{ IsCompleted = $true }
          $script:FeaturesCheckTimeout = $null
          $script:OptionalFeaturesReady = $false
          $script:OptionalFeaturesCheckStarted = $true
          & $onTick
          if (-not $script:OptionalFeaturesReady -or $script:OptionalFeaturesCheckStarted -or
              $script:OptionalFeatureStateCache['btnFeatXPS'] -ne $false -or
              $script:OptionalFeatureProviderCache['btnFeatXPS'].Name -ne 'XPS.Viewer~~~~0.0.1.0' -or
              $script:OptionalFeaturePendingCache['btnFeatXPS'] -ne 'DisablePending' -or
              -not $script:OptionalFeatureUnknownCache.ContainsKey('btnFeatXPS') -or
              -not (@($script:MockLogs) -match 'last verified state retained')) {
              throw 'An unknown state after retry did not retain and warn about the last verified snapshot.'
          }

          # A malformed completion result must fail closed and clear the
          # running flag so the user can retry.
          function Show-TweakStatesLoadError { param([string]$Message) $script:MockErrors += $Message }
          $script:MockErrors = @()
          $script:MockRawResult = @(@{
              States = @{ 'btnFeatHyperV' = $true; 'btnFeatXPS' = $false }
              Providers = @{
                  'btnFeatHyperV' = @{ Type = 'Feature'; Name = 'Microsoft-Hyper-V-All' }
                  'btnFeatXPS' = $null
              }
              Unavailable = @{}
              Pending = @{}
              Unknown = @{}
          })
          $script:FeaturesCheckPS = $fakeScanPs
          $script:FeaturesCheckAsync = [pscustomobject]@{ IsCompleted = $true }
          $script:FeaturesCheckTimeout = $null
          $script:OptionalFeaturesReady = $true
          $script:OptionalFeaturesCheckStarted = $true
          & $onTick
          if ($script:OptionalFeaturesReady -or $script:OptionalFeaturesCheckStarted -or
              -not (@($script:MockErrors) -match 'Optional-feature verification failed')) {
              throw 'A malformed optional-feature completion did not fail closed and become retryable.'
          }

          # A timeout must clear every cached feature classification and remain
          # fail-closed while stopping the outstanding worker.
          $script:MockErrors = @()
          $script:MockStopCalls = @()
          $fakeTimeout = [pscustomobject]@{}
          $fakeTimeout | Add-Member -MemberType ScriptMethod -Name Stop -Value { }
          $script:FeaturesCheckTimeout = $fakeTimeout
          $script:FeaturesCheckPS = $fakeScanPs
          $script:FeaturesCheckAsync = [pscustomobject]@{ IsCompleted = $false }
          $script:OptionalFeaturesReady = $false
          $script:OptionalFeaturesCheckStarted = $true
          $script:OptionalFeatureStateCache = @{ 'btnFeatXPS' = $true }
          $script:OptionalFeatureUnavailableCache = @{ 'btnFeatXPS' = 'unavailable' }
          $script:OptionalFeatureProviderCache = @{ 'btnFeatXPS' = @{ Type = 'Capability'; Name = 'XPS.Viewer~~~~0.0.1.0' } }
          $script:OptionalFeaturePendingCache = @{ 'btnFeatXPS' = 'InstallPending' }
          $script:OptionalFeatureUnknownCache = @{ 'btnFeatXPS' = 'unknown' }
          & $timeoutCallback
          if ($script:OptionalFeaturesReady -or $script:OptionalFeaturesCheckStarted -or
              $script:OptionalFeatureStateCache.Count -ne 0 -or
              $script:OptionalFeatureUnavailableCache.Count -ne 0 -or
              $script:OptionalFeatureProviderCache.Count -ne 0 -or
              $script:OptionalFeaturePendingCache.Count -ne 0 -or
              $script:OptionalFeatureUnknownCache.Count -ne 0 -or
              -not (@($script:MockErrors) -match 'detection timed out') -or
              -not (@($script:MockStopCalls) -match 'timeout')) {
              throw 'The optional-feature timeout did not fail closed and clear its cached state.'
          }
          Write-Host 'PASS: worker startup and setup failures remain fail-closed and retryable.'
          Write-Host 'PASS: the shared retry stops a live tweak-state worker before replacement.'
          Write-Host 'PASS: retry preserves the last verified snapshot for a later unknown state.'
          Write-Host 'PASS: malformed completion fails closed and timeout clears all cached states.'

      - name: Smoke test High Contrast flag bit updates
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          function Find-FunctionText([string]$name) {
              $node = $ast.Find({
                  param($n)
                  $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name
              }, $true)
              if (-not $node) { throw "Missing function: $name" }
              return $node.Extent.Text
          }
          Invoke-Expression (Find-FunctionText 'ConvertTo-Int')
          Invoke-Expression (Find-FunctionText 'Get-WmtHighContrastFlags')
          $cases = @(
              @{ Flags = 4152; Enable = $true; Expected = 4153 },
              @{ Flags = 4152; Enable = $false; Expected = 4152 },
              @{ Flags = 4153; Enable = $true; Expected = 4153 },
              @{ Flags = 4153; Enable = $false; Expected = 4152 },
              @{ Flags = 1; Enable = $false; Expected = 0 },
              @{ Flags = 0; Enable = $true; Expected = 1 },
              @{ Flags = 0; Enable = $false; Expected = 0 },
              @{ Flags = 16; Enable = $true; Expected = 17 },
              @{ Flags = 16; Enable = $false; Expected = 16 }
          )
          foreach ($case in $cases) {
              $actual = Get-WmtHighContrastFlags -CurrentFlags $case.Flags -Enable $case.Enable
              if ($actual -ne $case.Expected) {
                  throw "High Contrast flags $($case.Flags) (enable=$($case.Enable)) became $actual instead of $($case.Expected)."
              }
          }
          # Execute the production click callback with mocked registry writes.
          $hcClick = $ast.Find({
                  param($node)
                  $node -is [System.Management.Automation.Language.InvokeMemberExpressionAst] -and
                      $node.Member.Value -eq 'Add_Click' -and
                      $node.Extent.Text -match 'Get-WmtHighContrastFlags'
              }, $true)
          if (-not $hcClick -or $hcClick.Arguments.Count -ne 1) {
              throw 'Could not locate the High Contrast click callback.'
          }
          $handlerText = $hcClick.Arguments[0].Extent.Text
          $handlerText = $handlerText.Substring(1, $handlerText.Length - 2)
          $handler = [scriptblock]::Create($handlerText)
          $script:MockHighContrastFlags = 4152
          function Clear-WmtRegCache {
              param([string[]]$Path = @(), [switch]$PreserveUiSnapshot)
          }
          function Get-WmtRegValue {
              param($Path, $Name, $Default = $null)
              return $script:MockHighContrastFlags
          }
          function Set-WmtRegDword {
              param($Path, $Name, $Value)
              $script:MockHighContrastFlags = [int]$Value
          }
          function Invoke-UiCommand {
              param([scriptblock]$Sb, [string]$Msg = '')
              & $Sb
          }
          function Write-GuiLog { param([string]$Message) }
          function Update-WmtTweakToggle {
              param($Button, [bool]$On, [string]$OnText, [string]$OffText)
          }
          & $handler
          if ($script:MockHighContrastFlags -ne 4153) {
              throw "High Contrast enable changed Flags to $($script:MockHighContrastFlags) instead of 4153."
          }
          & $handler
          if ($script:MockHighContrastFlags -ne 4152) {
              throw "High Contrast disable changed Flags to $($script:MockHighContrastFlags) instead of 4152."
          }
          $script:MockHighContrastFlags = 16
          & $handler
          if ($script:MockHighContrastFlags -ne 17) {
              throw "High Contrast enable destroyed unrelated Flags bits: $($script:MockHighContrastFlags)."
          }
          & $handler
          if ($script:MockHighContrastFlags -ne 16) {
              throw "High Contrast disable destroyed unrelated Flags bits: $($script:MockHighContrastFlags)."
          }
          Write-Host 'PASS: the production High Contrast callback preserves every unrelated Flags bit.'

      - name: Smoke test Scoop status line parsing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          function Find-FunctionText([string]$name) {
              $node = $ast.Find({
                  param($n)
                  $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name
              }, $true)
              if (-not $node) { throw "Missing function: $name" }
              return $node.Extent.Text
          }
          foreach ($helperName in @(
              'Test-WmtScoopVersionText',
              'Get-WmtScoopStatusTableColumns',
              'ConvertFrom-WmtScoopCurrentStatusRow',
              'ConvertFrom-WmtScoopStatusLine',
              'ConvertFrom-WmtScoopStatus',
              'New-WmtProviderScanStatus',
              'ConvertFrom-WmtPnpmOutdatedJson',
              'Test-WmtSettingsMember',
              'Get-WmtSettingsMember',
              'Get-WmtProviderCapabilities',
              'Get-WmtProviderToggleDefaults',
              'Get-WmtProviderToggles',
              'Get-WmtProviderToggle',
              'Get-WmtProviderToggleOverride',
              'Get-WmtUpdateAutoInstallEnabled',
              'Get-WmtEffectiveProviderAutoUpdate',
              'Test-WmtAnyProviderAutoUpdateEnabled',
              'Get-WmtCanonicalProviderKey',
              'Get-WmtProviderKeyForPackageSource',
              'Get-WingetListedUpdateItems',
              'ConvertTo-WmtUpdateAllActionItems',
              'Invoke-WmtAutoInstallAvailableUpdates',
              'Get-WmtUpdateScanCompletion',
              'Get-WmtUpdateScanAutoInstallDecision'
          )) {
              Invoke-Expression (Find-FunctionText $helperName)
          }
          $ignored = @(
              '',
              '   ',
              'Name                Version            Source',
              'Name                Installed Version Latest Version Missing Dependencies Info',
              '----                ------            ------',
              'Scoop is up to date.',
              'Everything is ok!',
              "WARN  Scoop bucket(s) out of date. Run 'scoop update' to get the latest changes.",
              'WARNING  Another diagnostic line.',
              'ERROR  Broken manifest.',
              'INFO main bucket is stale',
              'Bucket main is out of date',
              'Updates are available for:'
          )
          foreach ($line in $ignored) {
              $row = ConvertFrom-WmtScoopStatusLine -Line $line
              if ($row) {
                  throw "A Scoop status line was parsed as a package: '$line'."
              }
          }
          $ansiWarning = ([string][char]27) + '[31mWARN  Scoop bucket(s) out of date.' + ([string][char]27) + '[0m'
          $row = ConvertFrom-WmtScoopStatusLine -Line $ansiWarning
          if ($row) {
              throw 'An ANSI-colored Scoop diagnostic was parsed as a package.'
          }
          $row = ConvertFrom-WmtScoopStatusLine -Line '7zip 23.01 24.08'
          if (-not $row -or $row.Name -ne '7zip' -or $row.Version -ne '23.01' -or $row.Available -ne '24.08') {
              throw 'A real Scoop package row was not parsed correctly.'
          }
          $row = ConvertFrom-WmtScoopStatusLine -Line '  git 2.46.0 2.47.0  '
          if (-not $row -or $row.Name -ne 'git' -or $row.Version -ne '2.46.0' -or $row.Available -ne '2.47.0') {
              throw 'A trimmed Scoop package row was not parsed correctly.'
          }
          $row = ConvertFrom-WmtScoopStatusLine -Line '7zip: 19.00 -> 19.01'
          if (-not $row -or $row.Name -ne '7zip' -or $row.Version -ne '19.00' -or $row.Available -ne '19.01') {
              throw 'A legacy Scoop arrow update was not parsed correctly.'
          }
          $row = ConvertFrom-WmtScoopStatusLine -Line 'git 2.46.0 main'
          if ($row) {
              throw 'A scoop list Name/Version/Source row was mistaken for an update.'
          }
          # Execute the production output-to-row conversion with the current
          # Scoop table shape and its diagnostic/success messages.
          $scoopOutput = @'
          WARN  Scoop bucket(s) out of date. Run 'scoop update' to get the latest changes.
          INFO main bucket is stale
          Name                Installed Version Latest Version Missing Dependencies Info
          ----                -------------- ------------- -------------------- --------------
          7zip                23.01           24.08
          git                 2.46.0          2.47.0
          broken              1.0                          dep
          missinglatest       2.0                          python3
          '@
          $rows = @(ConvertFrom-WmtScoopStatus -Output '7zip 23.01 24.08')
          if ($rows.Count -ne 1 -or $rows[0].Name -ne '7zip' -or $rows[0].Available -ne '24.08') {
              throw 'The production Scoop conversion lost a compatible headerless current row.'
          }
          $rows = @(ConvertFrom-WmtScoopStatus -Output $scoopOutput)
          if ($rows.Count -ne 2 -or $rows[0].Source -ne 'scoop' -or
              $rows[0].Name -ne '7zip' -or $rows[0].Version -ne '23.01' -or
              $rows[0].Available -ne '24.08' -or $rows[1].Name -ne 'git') {
              throw 'The production Scoop conversion included diagnostics, lost rows, or invented a missing-dependency update.'
          }
          $rows = @(ConvertFrom-WmtScoopStatus -Output $scoopOutput -IgnoreList @('7zip'))
          if ($rows.Count -ne 1 -or $rows[0].Name -ne 'git') {
              throw 'The production Scoop conversion did not honor the ignore list.'
          }
          $rows = @(ConvertFrom-WmtScoopStatus -Output "Everything is ok!`r`n")
          if ($rows.Count -ne 0) {
              throw 'The production Scoop conversion treated the success message as an update.'
          }
          # Scoop releases before v0.2 emitted update rows as "name: old -> new".
          $legacyOutput = @'
          Updates are available for:
              7zip: 19.00 -> 19.01
              git: 2.46.0 -> 2.47.0
          '@
          $rows = @(ConvertFrom-WmtScoopStatus -Output $legacyOutput)
          if ($rows.Count -ne 2 -or $rows[0].Name -ne '7zip' -or
              $rows[0].Version -ne '19.00' -or $rows[0].Available -ne '19.01' -or
              $rows[1].Name -ne 'git') {
              throw 'The production Scoop conversion lost a legacy arrow update.'
          }
          # `scoop list` reports installed packages, not available updates.
          $installedListOutput = @'
          Name                Version            Source            Updated                 Info
          ----                ------            ------            ------                 ----
          git                 2.46.0             custom            2026-11-20 12:00:00
          nightly-tool        1.0                nightly           2026-11-20 12:00:00
          '@
          $rows = @(ConvertFrom-WmtScoopStatus -Output $installedListOutput)
          if ($rows.Count -ne 0) {
              throw 'The production Scoop conversion treated scoop list output as an update.'
          }

          # Provider failures are isolated diagnostics. The aggregate scan is
          # still complete, and eligible updates from successful providers stay
          # actionable.
          $complete = Get-WmtUpdateScanCompletion -UpdateCount 0 -ProviderFailures @{}
          if (-not $complete.IsComplete -or -not $complete.AutoInstallAllowed -or
              $complete.HasProviderFailures -or
              $complete.LogMessage -ne 'System is up to date.') {
              throw 'A successful package scan did not retain its complete outcome.'
          }
          $partial = Get-WmtUpdateScanCompletion -UpdateCount 3 -ProviderFailures @{ scoop = 'exit code 7' }
          if (-not $partial.IsComplete -or -not $partial.AutoInstallAllowed -or
              -not $partial.HasProviderFailures -or
              $partial.LogMessage -notmatch '^Scan complete' -or
              $partial.LogMessage -notmatch 'provider failed independently: scoop' -or
              $partial.LogMessage -match '^Scan incomplete') {
              throw 'A failed package provider did not remain isolated from successful providers.'
          }

          # Exercise the production auto-update setting resolver with the
          # global switch off. This is the value used by the scan-completion
          # gate to decide whether an auto-install message is meaningful.
          $script:ciAutoInstallSettings = [pscustomobject]@{
              EnabledProviders = @('winget', 'windowsupdate', 'pip')
              UpdateAutoInstallEnabled = $false
              ProviderToggles = [pscustomobject]@{
                  winget = [pscustomobject]@{ Search = $true; Scan = $true; Logs = $true }
                  windowsupdate = [pscustomobject]@{ Search = $false; Scan = $true; Logs = $true }
                  pip = [pscustomobject]@{ Search = $true; Scan = $true; Logs = $true }
              }
              ProviderExecutionOverrides = [pscustomobject]@{}
          }
          $script:ciGuiLog = [System.Collections.Generic.List[string]]::new()
          function Get-WmtSettings { return $script:ciAutoInstallSettings }
          function Write-GuiLog { param($Message) [void]$script:ciGuiLog.Add([string]$Message) }
          if (Test-WmtAnyProviderAutoUpdateEnabled -Settings $script:ciAutoInstallSettings) {
              throw 'The production resolver enabled auto install while the global switch was off.'
          }
          $script:ciAutoInstallSettings.UpdateAutoInstallEnabled = $true
          if (-not (Test-WmtAnyProviderAutoUpdateEnabled -Settings $script:ciAutoInstallSettings)) {
              throw 'The production resolver did not enable auto install when the global switch was on.'
          }
          $script:ciAutoInstallSettings.UpdateAutoInstallEnabled = $false
          $script:ciAutoInstallSettings.ProviderExecutionOverrides = [pscustomobject]@{
              winget = [pscustomobject]@{ AutoUpdate = $true }
          }
          if (-not (Test-WmtAnyProviderAutoUpdateEnabled -Settings $script:ciAutoInstallSettings)) {
              throw 'The production resolver ignored an explicit per-provider auto-update override.'
          }

          # Provider failures must not produce an auto-install skip diagnostic
          # when automatic installation is disabled. There is nothing to skip.
          $disabledDecision = Get-WmtUpdateScanAutoInstallDecision `
              -ScanCompletion $partial `
              -AutoInstallEnabled $false
          if ($disabledDecision.ShouldInvoke -or
              -not [string]::IsNullOrWhiteSpace([string]$disabledDecision.LogMessage)) {
              throw 'A provider failure reported an auto-install skip while auto install was disabled.'
          }
          $enabledFailureDecision = Get-WmtUpdateScanAutoInstallDecision `
              -ScanCompletion $partial `
              -AutoInstallEnabled $true
          if (-not $enabledFailureDecision.ShouldInvoke -or
              -not [string]::IsNullOrWhiteSpace([string]$enabledFailureDecision.LogMessage)) {
              throw 'An enabled auto install did not continue after an unrelated provider failed.'
          }
          $enabledCompleteDecision = Get-WmtUpdateScanAutoInstallDecision `
              -ScanCompletion $complete `
              -AutoInstallEnabled $true
          if (-not $enabledCompleteDecision.ShouldInvoke -or
              -not [string]::IsNullOrWhiteSpace([string]$enabledCompleteDecision.LogMessage)) {
              throw 'A complete scan did not invoke the enabled auto install.'
          }
          $verificationDecision = Get-WmtUpdateScanAutoInstallDecision `
              -ScanCompletion $complete `
              -AutoInstallEnabled $true `
              -SuppressNextScan $true
          if ($verificationDecision.ShouldInvoke -or
              $verificationDecision.LogMessage -ne 'Auto install skipped for this verification scan.') {
              throw 'The post-action verification scan did not suppress the enabled auto install.'
          }

          # Exercise the production auto-install dispatcher with representative
          # list rows. Global auto-install is on, Windows Update explicitly
          # opts out, Pip inherits the global value, and an unrelated failed
          # Scoop provider must not block Pip.
          $script:ciAutoInstallAction = $null
          $Script:StartWingetAction = {
              param($ListItems, $ActionName, $CmdTemplate)
              $script:ciAutoInstallAction = [pscustomobject]@{
                  Items = @($ListItems)
                  ActionName = [string]$ActionName
              }
          }
          function Test-WingetRestartRiskItem { param($Item) return $false }
          function Show-WmtBackgroundInstallNotification {
              param(
                  [ValidateSet('Started', 'Completed', 'Interrupted')][string]$Status,
                  [int]$TotalCount = 0,
                  [int]$SuccessCount = 0,
                  [int]$SkippedCount = 0,
                  [int]$FailedCount = 0
              )
          }
          $lstWinget = [pscustomobject]@{
              Items = @(
                  [pscustomobject]@{
                      Source = 'windowsupdate'
                      Name = 'Simulated Windows Update'
                      Id = '00000000-0000-0000-0000-000000000000|1'
                      Version = '1.0'
                      Available = '2.0'
                  },
                  [pscustomobject]@{
                      Source = 'pip'
                      Name = 'Simulated Pip Update'
                      Id = 'simulated-pip-update'
                      Version = '1.0'
                      Available = '2.0'
                  },
                  [pscustomobject]@{
                      Source = 'scoop'
                      Name = 'Simulated Scoop Update'
                      Id = 'simulated-scoop-update'
                      Version = '1.0'
                      Available = '2.0'
                  }
              )
          }
          $script:ciAutoInstallSettings.UpdateAutoInstallEnabled = $true
          $script:ciAutoInstallSettings.ProviderExecutionOverrides = [pscustomobject]@{
              windowsupdate = [pscustomobject]@{ AutoUpdate = $false }
          }
          $script:WmtScanProviderFailures = @{ scoop = 'simulated provider failure' }
          $script:WmtAutoInstallActive = $false
          $script:WingetActiveAction = $null
          $script:ciGuiLog.Clear()
          Invoke-WmtAutoInstallAvailableUpdates
          if ($null -eq $script:ciAutoInstallAction -or
              $script:ciAutoInstallAction.ActionName -ne 'Update' -or
              @($script:ciAutoInstallAction.Items).Count -ne 1 -or
              [string]$script:ciAutoInstallAction.Items[0].Id -ne 'simulated-pip-update') {
              throw 'The enabled production auto-install path did not dispatch the eligible Pip update while excluding Windows Update and failed Scoop.'
          }
          if (@($script:ciGuiLog | Where-Object { $_ -eq 'Auto install starting 1 available update(s).' }).Count -ne 1) {
              throw 'The enabled production auto-install path did not report that it started an update.'
          }

          # Repeat with the global switch off. The production dispatcher must
          # remain silent and must not enqueue any update action.
          $script:ciAutoInstallSettings.UpdateAutoInstallEnabled = $false
          $script:ciAutoInstallSettings.ProviderExecutionOverrides = [pscustomobject]@{}
          $script:ciAutoInstallAction = $null
          $script:WmtAutoInstallActive = $false
          $script:WingetActiveAction = $null
          $script:ciGuiLog.Clear()
          Invoke-WmtAutoInstallAvailableUpdates
          if ($null -ne $script:ciAutoInstallAction -or
              @($script:ciGuiLog | Where-Object { $_ -match '^Auto install' }).Count -ne 0) {
              throw 'The disabled production auto-install path started an update or emitted an auto-install message.'
          }

          # The pooled scan worker must use the shared production converter.
          $scoopStart = $source.IndexOf('# E. SCOOP WORKER')
          $scoopEnd = $source.IndexOf('# F. RUBY GEMS WORKER', $scoopStart)
          if ($scoopStart -lt 0 -or $scoopEnd -le $scoopStart) {
              throw 'Could not locate the Scoop update scan.'
          }
          $scoopWorker = $source.Substring($scoopStart, $scoopEnd - $scoopStart)
          if ($scoopWorker -notmatch 'ConvertFrom-WmtScoopStatus\b') {
              throw 'The Scoop update scan must use the shared status converter.'
          }
          # Execute the production worker against a deterministic scoop.cmd.
          # A nonzero command must be a failed scan, not an empty update list.
          $scoopAddScript = $ast.Find({
              param($node)
              $node -is [System.Management.Automation.Language.InvokeMemberExpressionAst] -and
                  $node.Member.Value -eq 'AddScript' -and
                  $node.Extent.Text -match 'Scanning Scoop'
          }, $true)
          if (-not $scoopAddScript -or $scoopAddScript.Arguments.Count -ne 1) {
              throw 'Could not extract the production Scoop worker.'
          }
          $scoopWorkerText = $scoopAddScript.Arguments[0].Extent.Text
          $scoopWorkerBlock = [scriptblock]::Create($scoopWorkerText.Substring(1, $scoopWorkerText.Length - 2))
          $scoopFixtureDir = Join-Path $env:RUNNER_TEMP ('wmt-scoop-' + [Guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($scoopFixtureDir)
          $oldScoopPath = $env:PATH
          try {
              # With no Scoop executable on PATH, the production worker must
              # report one attributable typed failure and no package rows.
              $env:PATH = $scoopFixtureDir
              $missingScoopOutput = @(& $scoopWorkerBlock @())
              $missingScoopRows = @($missingScoopOutput | Where-Object { $_ -is [pscustomobject] -and $_.Source -eq 'scoop' })
              $missingScoopStatuses = @($missingScoopOutput | Where-Object { $_ -is [pscustomobject] -and $_.WmtStateType -eq 'ProviderScanStatus' })
              if ($missingScoopRows.Count -ne 0 -or $missingScoopStatuses.Count -ne 1 -or
                  $missingScoopStatuses[0].Provider -ne 'scoop' -or $missingScoopStatuses[0].Success -or
                  $missingScoopStatuses[0].Message -notmatch 'not found' -or
                  @($missingScoopOutput | Where-Object { [string]$_ -match 'Scoop was not found; this enabled provider scan failed independently' }).Count -ne 1) {
                  throw 'A missing Scoop executable was not reported as an attributable provider failure.'
              }

              @'
          @echo off
          echo WARN  Scoop bucket(s) out of date.
          echo Name                Installed Version Latest Version Missing Dependencies Info
          echo ----                -------------- ------------- -------------------- --------------
          echo 7zip                23.01           24.08
          exit /b 0
          '@ | Set-Content -LiteralPath (Join-Path $scoopFixtureDir 'scoop.cmd') -Encoding Ascii
              $env:PATH = $scoopFixtureDir + ';' + $oldScoopPath
              $workerOutput = @(& $scoopWorkerBlock @())
              $workerRows = @($workerOutput | Where-Object { $_ -is [pscustomobject] -and $_.Source -eq 'scoop' })
              if ($workerRows.Count -ne 1 -or $workerRows[0].Name -ne '7zip' -or
                  @($workerOutput | Where-Object { [string]$_ -match '^LOG:Scanning Scoop' }).Count -ne 1) {
                  throw 'The production Scoop worker did not return the expected package row.'
              }
              @'
          @echo off
          echo simulated scoop failure 1>&2
          exit /b 7
          '@ | Set-Content -LiteralPath (Join-Path $scoopFixtureDir 'scoop.cmd') -Encoding Ascii
              $workerOutput = @(& $scoopWorkerBlock @())
              $workerRows = @($workerOutput | Where-Object { $_ -is [pscustomobject] -and $_.Source -eq 'scoop' })
              $workerStatuses = @($workerOutput | Where-Object { $_ -is [pscustomobject] -and $_.WmtStateType -eq 'ProviderScanStatus' })
              if ($workerRows.Count -ne 0 -or $workerStatuses.Count -ne 1 -or
                  $workerStatuses[0].Provider -ne 'scoop' -or $workerStatuses[0].Success -or
                  @($workerOutput | Where-Object { [string]$_ -match 'LOG:Scoop check failed: simulated scoop failure' }).Count -ne 1) {
                  throw 'A failed Scoop command was reported as an empty successful update scan.'
              }
              @'
          @echo off
          exit /b 9
          '@ | Set-Content -LiteralPath (Join-Path $scoopFixtureDir 'scoop.cmd') -Encoding Ascii
              $workerOutput = @(& $scoopWorkerBlock @())
              $workerRows = @($workerOutput | Where-Object { $_ -is [pscustomobject] -and $_.Source -eq 'scoop' })
              $workerStatuses = @($workerOutput | Where-Object { $_ -is [pscustomobject] -and $_.WmtStateType -eq 'ProviderScanStatus' })
              if ($workerRows.Count -ne 0 -or $workerStatuses.Count -ne 1 -or
                  $workerStatuses[0].Success -or
                  @($workerOutput | Where-Object { [string]$_ -match 'LOG:Scoop check failed: exit code 9' }).Count -ne 1) {
                  throw 'A Scoop command without stderr did not report its nonzero exit code.'
              }
              @'
          @echo off
          ping -n 6 127.0.0.1 >nul
          exit /b 0
          '@ | Set-Content -LiteralPath (Join-Path $scoopFixtureDir 'scoop.cmd') -Encoding Ascii
              $workerOutput = @(& $scoopWorkerBlock @() -TimeoutMs 25)
              $workerRows = @($workerOutput | Where-Object { $_ -is [pscustomobject] -and $_.Source -eq 'scoop' })
              $workerStatuses = @($workerOutput | Where-Object { $_ -is [pscustomobject] -and $_.WmtStateType -eq 'ProviderScanStatus' })
              if ($workerRows.Count -ne 0 -or $workerStatuses.Count -ne 1 -or
                  $workerStatuses[0].Success -or $workerStatuses[0].Message -notmatch 'timed out' -or
                  @($workerOutput | Where-Object { [string]$_ -match 'LOG:Scoop scan timed out' }).Count -ne 1) {
                  throw 'A timed-out Scoop command was not reported as an incomplete provider scan.'
              }
          }
          finally {
              $env:PATH = $oldScoopPath
              Remove-Item -LiteralPath $scoopFixtureDir -Recurse -Force -ErrorAction SilentlyContinue
          }

          # pnpm 10+ returns object-shaped JSON keyed by package name and uses
          # "{}" for a successful scan with no updates. Older releases returned
          # an array. Both shapes are valid, including a one-element array on
          # Windows PowerShell 5.1 where ConvertFrom-Json unrolls the pipeline.
          $emptyPnpm = ConvertFrom-WmtPnpmOutdatedJson -Output '{}'
          if (-not $emptyPnpm.Valid -or @($emptyPnpm.Rows).Count -ne 0) {
              throw 'The production pnpm converter rejected an empty object result.'
          }
          $objectPnpm = ConvertFrom-WmtPnpmOutdatedJson -Output '{"object-tool":{"current":"1.0.0","latest":"2.0.0"}}'
          if (-not $objectPnpm.Valid -or @($objectPnpm.Rows).Count -ne 1 -or
              [string]$objectPnpm.Rows[0].Name -ne 'object-tool' -or
              [string]$objectPnpm.Rows[0].Version -ne '1.0.0' -or
              [string]$objectPnpm.Rows[0].Available -ne '2.0.0') {
              throw 'The production pnpm converter rejected current object-shaped JSON.'
          }
          $arrayPnpm = ConvertFrom-WmtPnpmOutdatedJson -Output '[{"name":"array-tool","current":"3.0.0","latest":"4.0.0"}]'
          if (-not $arrayPnpm.Valid -or @($arrayPnpm.Rows).Count -ne 1 -or
              [string]$arrayPnpm.Rows[0].Name -ne 'array-tool' -or
              [string]$arrayPnpm.Rows[0].Version -ne '3.0.0' -or
              [string]$arrayPnpm.Rows[0].Available -ne '4.0.0') {
              throw 'The production pnpm converter rejected a legacy one-element JSON array.'
          }
          # pnpm disambiguates duplicate report entries by appending the
          # current version and dependency type to the JSON key. The manager
          # must act on the real package name, not the collision key, or the
          # generated selector becomes invalid ("foo@1.0.0 (dev)").
          $collisionPnpm = ConvertFrom-WmtPnpmOutdatedJson -Output '{"collision-tool@1.0.0 (dev)":{"current":"1.0.0","latest":"2.0.0"},"@scope/collision-tool@3.0.0 (peer)":{"current":"3.0.0","latest":"4.0.0"}}'
          if (-not $collisionPnpm.Valid -or @($collisionPnpm.Rows).Count -ne 2 -or
              [string]$collisionPnpm.Rows[0].Name -ne 'collision-tool' -or
              [string]$collisionPnpm.Rows[0].Id -ne 'collision-tool' -or
              [string]$collisionPnpm.Rows[0].Version -ne '1.0.0' -or
              [string]$collisionPnpm.Rows[0].Available -ne '2.0.0' -or
              [string]$collisionPnpm.Rows[1].Name -ne '@scope/collision-tool' -or
              [string]$collisionPnpm.Rows[1].Id -ne '@scope/collision-tool') {
              throw 'The production pnpm converter did not recover package names from collision keys.'
          }
          $ignoredCollisionPnpm = ConvertFrom-WmtPnpmOutdatedJson -Output '{"collision-tool@1.0.0 (dev)":{"current":"1.0.0","latest":"2.0.0"}}' -IgnoreList @('collision-tool')
          if (-not $ignoredCollisionPnpm.Valid -or @($ignoredCollisionPnpm.Rows).Count -ne 0) {
              throw 'The production pnpm converter ignored the collision key instead of the recovered package name.'
          }
          $invalidPnpm = ConvertFrom-WmtPnpmOutdatedJson -Output 'not-json'
          if ($invalidPnpm.Valid) {
              throw 'The production pnpm converter accepted invalid JSON.'
          }

          # Execute the production pnpm worker against a deterministic
          # pnpm.cmd. Object-shaped local/global rows must survive, and exit
          # code 1 remains authoritative when the JSON itself is valid.
          $pnpmAddScript = $ast.Find({
              param($node)
              $node -is [System.Management.Automation.Language.InvokeMemberExpressionAst] -and
                  $node.Member.Value -eq 'AddScript' -and
                  $node.Extent.Text -match 'Scanning Pnpm'
          }, $true)
          if (-not $pnpmAddScript -or $pnpmAddScript.Arguments.Count -ne 1) {
              throw 'Could not extract the production pnpm worker.'
          }
          $pnpmWorkerText = $pnpmAddScript.Arguments[0].Extent.Text
          $pnpmWorkerBlock = [scriptblock]::Create($pnpmWorkerText.Substring(1, $pnpmWorkerText.Length - 2))
          $pnpmFixtureDir = Join-Path $env:RUNNER_TEMP ('wmt-pnpm-' + [Guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($pnpmFixtureDir)
          $oldPnpmPath = $env:PATH
          try {
              @'
          @echo off
          if "%~2"=="-g" (
            echo {"global-tool":{"current":"3.0.0","latest":"4.0.0"}}
          ) else (
            echo {"local-tool":{"current":"1.0.0","latest":"2.0.0"}}
          )
          exit /b 0
          '@ | Set-Content -LiteralPath (Join-Path $pnpmFixtureDir 'pnpm.cmd') -Encoding Ascii
              $env:PATH = $pnpmFixtureDir + ';' + $oldPnpmPath
              $pnpmWorkerOutput = @(& $pnpmWorkerBlock @())
              $pnpmWorkerRows = @($pnpmWorkerOutput | Where-Object { $_ -is [pscustomobject] -and $_.Source -like 'pnpm*' })
              $pnpmWorkerStatuses = @($pnpmWorkerOutput | Where-Object { $_ -is [pscustomobject] -and $_.WmtStateType -eq 'ProviderScanStatus' })
              if ($pnpmWorkerRows.Count -ne 2 -or
                  @($pnpmWorkerRows | Where-Object { [string]$_.Name -eq 'local-tool' -and [string]$_.Source -eq 'pnpm' }).Count -ne 1 -or
                  @($pnpmWorkerRows | Where-Object { [string]$_.Name -eq 'global-tool' -and [string]$_.Source -eq 'pnpm (global)' }).Count -ne 1 -or
                  $pnpmWorkerStatuses.Count -ne 0) {
                  throw 'The production pnpm worker rejected current object-shaped local/global JSON.'
              }

              @'
          @echo off
          echo {}
          exit /b 0
          '@ | Set-Content -LiteralPath (Join-Path $pnpmFixtureDir 'pnpm.cmd') -Encoding Ascii
              $pnpmWorkerOutput = @(& $pnpmWorkerBlock @())
              $pnpmWorkerRows = @($pnpmWorkerOutput | Where-Object { $_ -is [pscustomobject] -and $_.Source -like 'pnpm*' })
              $pnpmWorkerStatuses = @($pnpmWorkerOutput | Where-Object { $_ -is [pscustomobject] -and $_.WmtStateType -eq 'ProviderScanStatus' })
              if ($pnpmWorkerRows.Count -ne 0 -or $pnpmWorkerStatuses.Count -ne 0) {
                  throw 'The production pnpm worker rejected the valid empty-object result.'
              }

              @'
          @echo off
          if "%~2"=="-g" (
            echo {"global-tool":{"current":"3.0.0","latest":"4.0.0"}}
          ) else (
            echo {"local-tool":{"current":"1.0.0","latest":"2.0.0"}}
          )
          exit /b 1
          '@ | Set-Content -LiteralPath (Join-Path $pnpmFixtureDir 'pnpm.cmd') -Encoding Ascii
              $pnpmWorkerOutput = @(& $pnpmWorkerBlock @())
              $pnpmWorkerRows = @($pnpmWorkerOutput | Where-Object { $_ -is [pscustomobject] -and $_.Source -like 'pnpm*' })
              $pnpmWorkerStatuses = @($pnpmWorkerOutput | Where-Object { $_ -is [pscustomobject] -and $_.WmtStateType -eq 'ProviderScanStatus' })
              if ($pnpmWorkerRows.Count -ne 2 -or $pnpmWorkerStatuses.Count -ne 0) {
                  throw 'The production pnpm worker treated valid JSON with exit code 1 as a provider failure.'
              }
          }
          finally {
              $env:PATH = $oldPnpmPath
              Remove-Item -LiteralPath $pnpmFixtureDir -Recurse -Force -ErrorAction SilentlyContinue
          }

          Write-Host 'PASS: current and legacy arrow Scoop output produce only real package update rows.'
          Write-Host 'PASS: missing dependencies and scoop list rows never fabricate package updates.'
          Write-Host 'PASS: the production Scoop worker surfaces command failures and timeouts as incomplete scans.'
          Write-Host 'PASS: current object-shaped and legacy array-shaped pnpm JSON produce package rows without false failures.'

      - name: Smoke test provider isolation and action recovery
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [System.IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput(
              $source,
              [ref]$tokens,
              [ref]$parseErrors
          )
          if ($parseErrors -and $parseErrors.Count -gt 0) {
              throw ($parseErrors.Message -join '; ')
          }

          foreach ($name in @(
              'Get-WmtCanonicalProviderKey',
              'Get-WmtCustomCommandSourceKey',
              'Get-WmtCustomCommandEntrySourceKey',
              'Get-WmtCustomCommandManagerEntries',
              'Get-WmtCustomUpdateCommands',
              'Get-WmtCustomUpdateCommand',
              'Set-WmtCustomUpdateCommand',
              'Remove-WmtCustomUpdateCommand',
              'New-WmtProviderScanStatus',
              'Set-WmtProviderScanFailure',
              'Start-WmtActiveScanWorker',
              'Start-WmtProviderScanWorker',
              'Receive-WmtProviderScanWorker',
              'Complete-WmtTimedOutProviderScanWorkers',
              'Get-WmtUpdateActionTimeoutSeconds',
              'Initialize-WmtUpdateActionItems',
              'Group-WmtUpdateActionItemsByProvider',
              'Complete-WmtUpdateActionProviderFailure',
              'Drain-WmtUpdateActionProviderOutput',
              'Receive-WmtUpdateActionProviderWorker',
              'Complete-WmtUpdateActionFinalization',
              'Get-WmtProviderEnabledIntent',
              'New-WmtProviderSettingsUiState',
              'Get-WmtProviderSettingsRegisteredState',
              'Test-WmtProviderSettingsOperationCurrent',
              'Register-WmtProviderSettingsDialogLifecycle',
              'Close-WmtProviderSettingsDialog'
          )) {
              $fn = $ast.Find({
                      param($node)
                      $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                      $node.Name -eq $name
                  }, $true)
              if (-not $fn) { throw "Required provider-isolation function is missing: $name" }
              Invoke-Expression $fn.Extent.Text
          }

          $script:ciGuiLog = [System.Collections.Generic.List[string]]::new()
          function Write-GuiLog { param([string]$Message) [void]$script:ciGuiLog.Add([string]$Message) }
          function Set-WmtUpdateListItemCheckState {
              param($Item, [switch]$DefaultChecked)
              return $Item
          }
          function Stop-WmtPowerShellInvocationAsync {
              param($PowerShell, $Invocation, [string]$Name = 'PowerShell invocation')
              try {
                  if ($PowerShell -is [System.Management.Automation.PowerShell]) {
                      $PowerShell.Stop()
                  }
                  $script:ciGuiLog.Add("STOPPED:$Name")
              }
              catch {
                  throw "simulated stop failure: $($_.Exception.Message)"
              }
          }
          function Start-WmtPowerShellCleanupDetached {
              param($PowerShell, $Invocation, [string]$Name = 'PowerShell invocation')
              $script:ciGuiLog.Add("CLEANUP:$Name")
          }

          $lstWinget = [pscustomobject]@{ Items = [System.Collections.Generic.List[object]]::new() }
          $script:ActiveScans = [System.Collections.Generic.List[object]]::new()
          $script:WmtScanProviderFailures = @{}
          $script:WmtDeferredWingetScanPending = $false
          $script:WmtDeferredWingetScan = $null
          $script:WmtProviderOwnershipIndex = @{ Name = @{}; Id = @{}; Path = @{} }
          $script:WmtSteamInstalledNameKeys = @{}
          $script:WmtWindowsUpdateRebootPendingCount = 0

          # A provider factory failure is local: the next provider still starts,
          # completes, and publishes its row.
          $badAsync = Start-WmtProviderScanWorker -ProviderName 'choco' -WorkerFactory {
              throw 'simulated provider startup failure'
          }
          if ($null -ne $badAsync) {
              throw 'A failed provider startup unexpectedly returned an invocation.'
          }
          if (-not $script:WmtScanProviderFailures.ContainsKey('chocolatey')) {
              throw 'The failed provider startup was not attributed to its canonical provider key.'
          }

          $goodAsync = Start-WmtProviderScanWorker -ProviderName 'good' -WorkerFactory {
              $ps = [System.Management.Automation.PowerShell]::Create()
              [void]$ps.AddScript({
                      [pscustomobject]@{
                          Source = 'good'
                          Name = 'Good Provider Package'
                          Id = 'good-package'
                          Version = '1.0'
                          Available = '2.0'
                      }
                  })
              $ps
          }
          if ($null -eq $goodAsync) {
              throw 'A provider after the failed startup was not allowed to start.'
          }
          $goodTask = @($script:ActiveScans | Where-Object { $_.Name -eq 'good' })[0]
          $goodDeadline = [DateTime]::UtcNow.AddSeconds(5)
          while ($goodTask -and -not $goodTask.AsyncResult.IsCompleted -and [DateTime]::UtcNow -lt $goodDeadline) {
              Start-Sleep -Milliseconds 10
          }
          if (-not $goodTask -or -not $goodTask.AsyncResult.IsCompleted) {
              throw 'The provider started after the isolated startup failure did not complete.'
          }
          Receive-WmtProviderScanWorker -Task $goodTask
          [void]$script:ActiveScans.Remove($goodTask)
          if (@($lstWinget.Items | Where-Object { $_.Id -eq 'good-package' }).Count -ne 1) {
              throw 'The successful provider row was lost after another provider startup failed.'
          }
          if ($script:WmtScanProviderFailures.ContainsKey('good')) {
              throw 'The successful provider was incorrectly marked as failed.'
          }

          # Canonical provider identity must not overwrite an operational source
          # variant. "npm (global)" still needs the global npm update command.
          $npmGlobalPs = [System.Management.Automation.PowerShell]::Create()
          [void]$npmGlobalPs.AddScript({
                  [pscustomobject]@{
                      Source = 'npm (global)'
                      Name = 'Global Npm Package'
                      Id = 'global-npm-package'
                      Version = '1.0'
                      Available = '2.0'
                  }
              })
          $npmGlobalAsync = $npmGlobalPs.BeginInvoke()
          $npmGlobalDeadline = [DateTime]::UtcNow.AddSeconds(5)
          while (-not $npmGlobalAsync.IsCompleted -and [DateTime]::UtcNow -lt $npmGlobalDeadline) {
              Start-Sleep -Milliseconds 10
          }
          if (-not $npmGlobalAsync.IsCompleted) {
              throw 'The npm global provider fixture did not complete.'
          }
          Receive-WmtProviderScanWorker -Task ([pscustomobject]@{
                  PowerShell = $npmGlobalPs
                  AsyncResult = $npmGlobalAsync
                  Name = 'npm'
              })
          $npmGlobalRow = @($lstWinget.Items | Where-Object { $_.Id -eq 'global-npm-package' })[0]
          if (-not $npmGlobalRow -or [string]$npmGlobalRow.Source -ne 'npm (global)' -or
              [string]$npmGlobalRow.WmtProviderKey -ne 'npm') {
              throw 'Canonical provider identity overwrote the operational npm global source.'
          }

          $pnpmGlobalPs = [System.Management.Automation.PowerShell]::Create()
          [void]$pnpmGlobalPs.AddScript({
                  [pscustomobject]@{
                      Source = 'pnpm (global)'
                      Name = 'Global Pnpm Package'
                      Id = 'global-pnpm-package'
                      Version = '1.0'
                      Available = '2.0'
                  }
              })
          $pnpmGlobalAsync = $pnpmGlobalPs.BeginInvoke()
          $pnpmGlobalDeadline = [DateTime]::UtcNow.AddSeconds(5)
          while (-not $pnpmGlobalAsync.IsCompleted -and [DateTime]::UtcNow -lt $pnpmGlobalDeadline) {
              Start-Sleep -Milliseconds 10
          }
          if (-not $pnpmGlobalAsync.IsCompleted) {
              throw 'The pnpm global provider fixture did not complete.'
          }
          Receive-WmtProviderScanWorker -Task ([pscustomobject]@{
                  PowerShell = $pnpmGlobalPs
                  AsyncResult = $pnpmGlobalAsync
                  Name = 'pnpm'
              })
          $pnpmGlobalRow = @($lstWinget.Items | Where-Object { $_.Id -eq 'global-pnpm-package' })[0]
          if (-not $pnpmGlobalRow -or [string]$pnpmGlobalRow.Source -ne 'pnpm (global)' -or
              [string]$pnpmGlobalRow.WmtProviderKey -ne 'pnpm') {
              throw 'Canonical provider identity overwrote the operational pnpm global source.'
          }

          # Custom update commands are scoped by the operational source. A
          # local npm command must not overwrite or resolve to the global npm
          # command for the same package ID; pnpm global/local must remain
          # separate in the same way.
          $script:ciCustomSettings = [pscustomobject]@{ CustomUpdateCommands = @() }
          function Get-WmtSettings { return $script:ciCustomSettings }
          function Save-WmtSettings { param($Settings) $script:ciCustomSettings = $Settings }
          Set-WmtCustomUpdateCommand -Source 'npm' -Id 'shared-tool' -Name 'Shared Tool' -Command 'npm update shared-tool'
          Set-WmtCustomUpdateCommand -Source 'npm (global)' -Id 'shared-tool' -Name 'Shared Tool' -Command 'npm update -g shared-tool'
          Set-WmtCustomUpdateCommand -Source 'pnpm' -Id 'shared-tool' -Name 'Shared Tool' -Command 'pnpm update shared-tool'
          Set-WmtCustomUpdateCommand -Source 'pnpm (global)' -Id 'shared-tool' -Name 'Shared Tool' -Command 'pnpm update -g shared-tool'
          $customCommands = @(Get-WmtCustomUpdateCommands -Settings $script:ciCustomSettings)
          if ($customCommands.Count -ne 4) {
              throw 'Custom update commands collapsed npm/pnpm local and global scopes.'
          }
          if ((Get-WmtCustomUpdateCommand -Source 'npm' -Id 'shared-tool' -Settings $script:ciCustomSettings) -ne 'npm update shared-tool' -or
              (Get-WmtCustomUpdateCommand -Source 'npm (global)' -Id 'shared-tool' -Settings $script:ciCustomSettings) -ne 'npm update -g shared-tool' -or
              (Get-WmtCustomUpdateCommand -Source 'pnpm' -Id 'shared-tool' -Settings $script:ciCustomSettings) -ne 'pnpm update shared-tool' -or
              (Get-WmtCustomUpdateCommand -Source 'pnpm (global)' -Id 'shared-tool' -Settings $script:ciCustomSettings) -ne 'pnpm update -g shared-tool') {
              throw 'Custom update command lookup crossed npm/pnpm local and global scopes.'
          }
          Remove-WmtCustomUpdateCommand -Source 'npm' -Id 'shared-tool'
          if ((Get-WmtCustomUpdateCommand -Source 'npm' -Id 'shared-tool' -Settings $script:ciCustomSettings) -ne '' -or
              (Get-WmtCustomUpdateCommand -Source 'npm (global)' -Id 'shared-tool' -Settings $script:ciCustomSettings) -ne 'npm update -g shared-tool') {
              throw 'Removing a local npm custom command also removed the global npm command.'
          }
          if ((Get-WmtCustomCommandSourceKey -Source 'npm-global') -ne 'npm (global)' -or
              (Get-WmtCustomCommandSourceKey -Source 'pnpm-global') -ne 'pnpm (global)') {
              throw 'Custom command source aliases did not preserve npm/pnpm global scope.'
          }

          # bb6dc22 persisted npm/pnpm global commands with the canonical local
          # provider source. Recover that legacy form from the explicit global
          # flag so it still resolves and can be removed only in global scope.
          $script:ciCustomSettings = [pscustomobject]@{
              CustomUpdateCommands = @(
                  [pscustomobject]@{ Source = 'npm'; Id = 'legacy-tool'; Name = 'Legacy Tool'; Command = 'npm update -g legacy-tool' }
                  [pscustomobject]@{ Source = 'npm'; Id = 'legacy-local'; Name = 'Legacy Local'; Command = 'npm update legacy-local' }
                  [pscustomobject]@{ Source = 'pnpm'; Id = 'legacy-tool'; Name = 'Legacy Tool'; Command = 'pnpm update -g legacy-tool' }
              )
          }
          if ((Get-WmtCustomUpdateCommand -Source 'npm (global)' -Id 'legacy-tool' -Settings $script:ciCustomSettings) -ne 'npm update -g legacy-tool' -or
              (Get-WmtCustomUpdateCommand -Source 'pnpm (global)' -Id 'legacy-tool' -Settings $script:ciCustomSettings) -ne 'pnpm update -g legacy-tool' -or
              (Get-WmtCustomUpdateCommand -Source 'npm' -Id 'legacy-tool' -Settings $script:ciCustomSettings) -ne '') {
              throw 'Legacy npm/pnpm global custom commands were not migrated to global scope.'
          }
          Remove-WmtCustomUpdateCommand -Source 'npm (global)' -Id 'legacy-tool'
          if ((Get-WmtCustomUpdateCommand -Source 'npm (global)' -Id 'legacy-tool' -Settings $script:ciCustomSettings) -ne '' -or
              (Get-WmtCustomUpdateCommand -Source 'npm' -Id 'legacy-local' -Settings $script:ciCustomSettings) -ne 'npm update legacy-local' -or
              (Get-WmtCustomUpdateCommand -Source 'pnpm (global)' -Id 'legacy-tool' -Settings $script:ciCustomSettings) -ne 'pnpm update -g legacy-tool') {
              throw 'Removing a legacy global custom command changed another npm/pnpm scope.'
          }

          # The custom-command manager must edit and remove legacy global
          # entries through their effective global scope. bb6dc22 persisted
          # those rows with the local provider source, so using the raw Source
          # would create a duplicate local entry or remove nothing.
          $script:ciCustomSettings = [pscustomobject]@{
              CustomUpdateCommands = @(
                  [pscustomobject]@{ Source = 'npm'; Id = 'manager-global'; Name = 'Manager Global'; Command = 'npm update -g manager-global' }
                  [pscustomobject]@{ Source = 'npm'; Id = 'manager-local'; Name = 'Manager Local'; Command = 'npm update manager-local' }
                  [pscustomobject]@{ Source = 'pnpm'; Id = 'manager-pnpm-global'; Name = 'Manager Pnpm Global'; Command = 'pnpm update -g manager-pnpm-global' }
              )
          }
          $managerRows = @(Get-WmtCustomCommandManagerEntries -Settings $script:ciCustomSettings)
          $managerGlobal = @($managerRows | Where-Object { $_.Id -eq 'manager-global' })[0]
          $managerLocal = @($managerRows | Where-Object { $_.Id -eq 'manager-local' })[0]
          $managerPnpmGlobal = @($managerRows | Where-Object { $_.Id -eq 'manager-pnpm-global' })[0]
          if (-not $managerGlobal -or $managerGlobal.Source -ne 'npm (global)' -or
              -not $managerPnpmGlobal -or $managerPnpmGlobal.Source -ne 'pnpm (global)' -or
              -not $managerLocal -or $managerLocal.Source -ne 'npm') {
              throw 'The custom-command manager did not normalize legacy global entries.'
          }
          # Edit through the row scope exactly as the manager dialog does.
          Set-WmtCustomUpdateCommand -Source $managerGlobal.Source -Id $managerGlobal.Id -Name $managerGlobal.Name -Command 'npm update -g manager-global --latest'
          $afterManagerEdit = @(Get-WmtCustomUpdateCommands -Settings $script:ciCustomSettings)
          if ($afterManagerEdit.Count -ne 3 -or
              (Get-WmtCustomUpdateCommand -Source 'npm (global)' -Id 'manager-global' -Settings $script:ciCustomSettings) -ne 'npm update -g manager-global --latest' -or
              (Get-WmtCustomUpdateCommand -Source 'npm' -Id 'manager-global' -Settings $script:ciCustomSettings) -ne '' -or
              (Get-WmtCustomUpdateCommand -Source 'npm' -Id 'manager-local' -Settings $script:ciCustomSettings) -ne 'npm update manager-local') {
              throw 'Editing a legacy global entry through the manager duplicated or moved it.'
          }
          Remove-WmtCustomUpdateCommand -Source $managerPnpmGlobal.Source -Id $managerPnpmGlobal.Id
          if ((Get-WmtCustomUpdateCommand -Source 'pnpm (global)' -Id 'manager-pnpm-global' -Settings $script:ciCustomSettings) -ne '' -or
              @(Get-WmtCustomUpdateCommands -Settings $script:ciCustomSettings).Count -ne 2) {
              throw 'Removing a legacy pnpm global entry through the manager left it or removed another scope.'
          }
          # Editing a local entry must remain local; scope is explicit, not
          # inferred from the custom command text at write time.
          Set-WmtCustomUpdateCommand -Source 'npm' -Id 'manager-local' -Name 'Manager Local' -Command 'npm update manager-local --latest'
          if ((Get-WmtCustomUpdateCommand -Source 'npm' -Id 'manager-local' -Settings $script:ciCustomSettings) -ne 'npm update manager-local --latest' -or
              (Get-WmtCustomUpdateCommand -Source 'npm (global)' -Id 'manager-local' -Settings $script:ciCustomSettings) -ne '') {
              throw 'Editing a local custom command moved it out of its operational scope.'
          }
          if ($source -notmatch '\$entries\s*=\s*@\(Get-WmtCustomCommandManagerEntries\s*\|\s*Sort-Object') {
              throw 'The custom-command manager still loads raw persisted sources instead of effective scopes.'
          }

          # Typed provider failures are canonicalized by the production collector.
          $statusPs = [System.Management.Automation.PowerShell]::Create()
          [void]$statusPs.AddScript({
                  [pscustomobject]@{
                      WmtStateType = 'ProviderScanStatus'
                      Provider = 'choco'
                      Success = $false
                      Message = 'simulated typed provider failure'
                  }
              })
          $statusAsync = $statusPs.BeginInvoke()
          $statusTask = [pscustomobject]@{
              PowerShell = $statusPs
              AsyncResult = $statusAsync
              Name = 'choco'
          }
          $statusDeadline = [DateTime]::UtcNow.AddSeconds(5)
          while (-not $statusAsync.IsCompleted -and [DateTime]::UtcNow -lt $statusDeadline) {
              Start-Sleep -Milliseconds 10
          }
          Receive-WmtProviderScanWorker -Task $statusTask
          if (-not $script:WmtScanProviderFailures.ContainsKey('chocolatey') -or
              [string]$script:WmtScanProviderFailures['chocolatey'] -notmatch 'typed provider failure') {
              throw 'A typed provider failure was not attributed to the canonical provider key.'
          }

          # The global scan timeout keeps a completed provider's row, fails only
          # providers still running, and separately attributes a deferred Winget
          # timeout.
          $pipPs = [System.Management.Automation.PowerShell]::Create()
          [void]$pipPs.AddScript({
                  [pscustomobject]@{
                      Source = 'pip'
                      Name = 'Completed Pip Package'
                      Id = 'completed-pip-package'
                      Version = '1.0'
                      Available = '2.0'
                  }
              })
          $pipAsync = $pipPs.BeginInvoke()
          $pipDeadline = [DateTime]::UtcNow.AddSeconds(5)
          while (-not $pipAsync.IsCompleted -and [DateTime]::UtcNow -lt $pipDeadline) {
              Start-Sleep -Milliseconds 10
          }
          if (-not $pipAsync.IsCompleted) {
              throw 'The completed timeout fixture did not finish.'
          }

          $scoopPs = [System.Management.Automation.PowerShell]::Create()
          [void]$scoopPs.AddScript({ Start-Sleep -Seconds 30 })
          $scoopAsync = $scoopPs.BeginInvoke()
          $script:WmtScanProviderFailures = @{}
          $script:ActiveScans.Clear()
          [void]$script:ActiveScans.Add([pscustomobject]@{
                  PowerShell = $pipPs
                  AsyncResult = $pipAsync
                  Name = 'pip'
              })
          [void]$script:ActiveScans.Add([pscustomobject]@{
                  PowerShell = $scoopPs
                  AsyncResult = $scoopAsync
                  Name = 'scoop'
              })
          $script:WmtDeferredWingetScanPending = $true
          $script:ciGuiLog.Clear()
          Complete-WmtTimedOutProviderScanWorkers -TimeoutSeconds 120
          if ($script:ActiveScans.Count -ne 0) {
              throw 'The scan timeout did not settle every provider worker.'
          }
          if (@($lstWinget.Items | Where-Object { $_.Id -eq 'completed-pip-package' }).Count -ne 1) {
              throw 'The scan timeout discarded a row from a provider that completed successfully.'
          }
          if (-not $script:WmtScanProviderFailures.ContainsKey('scoop') -or
              -not $script:WmtScanProviderFailures.ContainsKey('winget') -or
              $script:WmtScanProviderFailures.ContainsKey('pip') -or
              $script:WmtScanProviderFailures.Count -ne 2) {
              throw 'The scan timeout did not attribute failures to exactly the running and deferred providers.'
          }
          if (@($script:ciGuiLog | Where-Object { $_ -eq 'STOPPED:scoop scan timeout' }).Count -ne 1) {
              throw 'The scan timeout did not stop only the provider that was still running.'
          }

          # The production action initializer assigns global indexes before
          # provider grouping and preserves operational source variants.
          $npmActionRow = [pscustomobject]@{
              Source = 'npm (global)'
              Name = 'Global Npm Action'
              Id = 'global-npm-action'
              Version = '1.0'
              Available = '2.0'
              WmtProviderKey = 'npm'
          }
          $pipActionRow = [pscustomobject]@{
              Source = 'pip'
              Name = 'Pip Action'
              Id = 'pip-action'
              Version = '1.0'
              Available = '2.0'
              WmtProviderKey = 'pip'
          }
          $initializedActionItems = @(Initialize-WmtUpdateActionItems -Items @($npmActionRow, $pipActionRow, $npmActionRow))
          if ($initializedActionItems.Count -ne 2 -or
              [int]$initializedActionItems[0].WmtActionIndex -ne 1 -or
              [int]$initializedActionItems[1].WmtActionIndex -ne 2 -or
              [string]$initializedActionItems[0].Source -ne 'npm (global)' -or
              [string]$initializedActionItems[0].WmtProviderKey -ne 'npm') {
              throw 'The production action initializer did not retain global indexes and operational source identity.'
          }
          $initializedActionGroups = @(Group-WmtUpdateActionItemsByProvider -Items $initializedActionItems)
          if ($initializedActionGroups.Count -ne 2 -or
              @($initializedActionGroups | Where-Object { $_.ProviderKey -eq 'npm' }).Count -ne 1 -or
              @($initializedActionGroups | Where-Object { $_.ProviderKey -eq 'pip' }).Count -ne 1) {
              throw 'The production action initializer did not group canonical provider identities independently.'
          }

          # Provider aliases collapse to one action group.
          $groupedItems = @(
              [pscustomobject]@{ Source = 'choco'; Name = 'Chocolatey A'; Id = 'a'; WmtActionIndex = 1 },
              [pscustomobject]@{ Source = 'chocolatey'; Name = 'Chocolatey B'; Id = 'b'; WmtActionIndex = 2 },
              [pscustomobject]@{ Source = 'npm (global)'; Name = 'Npm A'; Id = 'c'; WmtActionIndex = 3 }
          )
          $providerGroups = @(Group-WmtUpdateActionItemsByProvider -Items $groupedItems)
          if ($providerGroups.Count -ne 2) {
              throw 'Provider aliases were not collapsed into canonical action groups.'
          }
          $chocolateyGroup = @($providerGroups | Where-Object { $_.ProviderKey -eq 'chocolatey' })[0]
          $npmGroup = @($providerGroups | Where-Object { $_.ProviderKey -eq 'npm' })[0]
          if (-not $chocolateyGroup -or @($chocolateyGroup.Items).Count -ne 2 -or
              -not $npmGroup -or @($npmGroup.Items).Count -ne 1) {
              throw 'Provider action grouping did not preserve every canonical provider item.'
          }

          # A Winget timeout and a separate worker exception fail only their own
          # provider items; a successful Pip provider remains successful.
          $script:WingetActiveAction = 'Update'
          $script:WingetProgressTotal = 3
          $script:WingetProgressDone = 0
          $script:WingetProgressSuccess = 0
          $script:WingetProgressSkipped = 0
          $script:WingetProgressFailed = 0
          $script:WingetCompletedIndexes = @{}
          $script:SetWingetLastResultUi = { param($ResultCode, $PackageName, $DoneIndex, $TotalCount) }
          $script:RefreshWingetProgressUi = { }
          $processActionLines = {
              param($lines, $ActionJob)
              foreach ($line in @($lines)) {
                  if ([string]$line -match '^RESULT:(\d+):(SUCCESS|SKIPPED|FAILED|CANCELLED):(.*)$') {
                      $doneIndex = [int]$matches[1]
                      $result = $matches[2]
                      if (-not $script:WingetCompletedIndexes.ContainsKey($doneIndex)) {
                          $script:WingetCompletedIndexes[$doneIndex] = $true
                          $script:WingetProgressDone++
                          if ($result -eq 'SUCCESS') { $script:WingetProgressSuccess++ }
                          elseif ($result -eq 'SKIPPED') { $script:WingetProgressSkipped++ }
                          else { $script:WingetProgressFailed++ }
                      }
                  }
              }
          }
          function New-CiFakeActionJob {
              param(
                  [string]$ProviderKey,
                  [object[]]$Items,
                  [bool]$Completed,
                  [object[]]$Output = @(),
                  [bool]$ThrowOnEnd = $false
              )
              $queue = [System.Collections.Concurrent.ConcurrentQueue[object]]::new()
              $handle = [pscustomobject]@{
                  Output = [object[]]$Output
                  ThrowOnEnd = [bool]$ThrowOnEnd
                  Disposed = $false
              }
              $handle | Add-Member -MemberType ScriptMethod -Name EndInvoke -Value {
                  param($Invocation)
                  if ($this.ThrowOnEnd) { throw 'simulated provider worker failure' }
                  return @($this.Output)
              }
              $handle | Add-Member -MemberType ScriptMethod -Name Dispose -Value {
                  $this.Disposed = $true
              }
              return [pscustomobject]@{
                  ProviderKey = $ProviderKey
                  Items = [object[]]$Items
                  Job = $handle
                  Invocation = [pscustomobject]@{ IsCompleted = [bool]$Completed }
                  Queue = $queue
                  Started = $true
                  StartedAt = [DateTime]::UtcNow.AddSeconds(-5)
                  DeadlineUtc = [DateTime]::UtcNow.AddSeconds(3600)
                  TimeoutSeconds = 3600
                  Completed = $false
                  TimedOut = $false
              }
          }

          $wingetActionItem = [pscustomobject]@{ Source = 'winget'; Name = 'Winget Item'; Id = 'winget-item'; WmtActionIndex = 1 }
          $pipActionItem = [pscustomobject]@{ Source = 'pip'; Name = 'Pip Item'; Id = 'pip-item'; WmtActionIndex = 2 }
          $gemActionItem = [pscustomobject]@{ Source = 'gem'; Name = 'Gem Item'; Id = 'gem-item'; WmtActionIndex = 3 }
          $pipActionJob = New-CiFakeActionJob -ProviderKey 'pip' -Items @($pipActionItem) -Completed $true -Output @('RESULT:2:SUCCESS:Pip Item')
          $gemActionJob = New-CiFakeActionJob -ProviderKey 'gem' -Items @($gemActionItem) -Completed $true -ThrowOnEnd $true
          $wingetActionJob = New-CiFakeActionJob -ProviderKey 'winget' -Items @($wingetActionItem) -Completed $false
          $wingetActionJob.DeadlineUtc = [DateTime]::UtcNow.AddSeconds(-1)
          $script:ciGuiLog.Clear()

          $pipOutcome = Receive-WmtUpdateActionProviderWorker -ActionJob $pipActionJob -ProcessLines $processActionLines
          $wingetOutcome = Receive-WmtUpdateActionProviderWorker -ActionJob $wingetActionJob -ProcessLines $processActionLines
          $gemOutcome = Receive-WmtUpdateActionProviderWorker -ActionJob $gemActionJob -ProcessLines $processActionLines
          if ($pipOutcome -ne 'Completed' -or $wingetOutcome -ne 'TimedOut' -or $gemOutcome -ne 'Failed') {
              throw 'Provider action timeout or runtime failure was not settled independently.'
          }
          if ($script:WingetProgressDone -ne 3 -or $script:WingetProgressSuccess -ne 1 -or
              $script:WingetProgressFailed -ne 2) {
              throw 'Provider action isolation did not preserve the successful provider result.'
          }
          if (@($script:ciGuiLog | Where-Object { $_ -match '^\[Update\]\[pip\] FAILED' }).Count -ne 0 -or
              @($script:ciGuiLog | Where-Object { $_ -match '^\[Update\]\[winget\] FAILED' }).Count -ne 1 -or
              @($script:ciGuiLog | Where-Object { $_ -match '^\[Update\]\[gem\] FAILED' }).Count -ne 1) {
              throw 'Provider action failure attribution crossed provider boundaries.'
          }

          # Final reconciliation is exactly once. It attributes an unaccounted
          # item to its provider and cannot double-count progress on a repeated
          # monitor tick.
          $finalSuccessItem = [pscustomobject]@{ Source = 'winget'; Name = 'Final Success Item'; Id = 'final-success'; WmtActionIndex = 1 }
          $finalMissingItem = [pscustomobject]@{ Source = 'gem'; Name = 'Final Missing Item'; Id = 'final-missing'; WmtActionIndex = 2 }
          $script:WingetActionItems = @($finalSuccessItem, $finalMissingItem)
          $script:WingetActionProviderGroups = @(Group-WmtUpdateActionItemsByProvider -Items $script:WingetActionItems)
          $script:WingetActionFinalized = $false
          $script:WingetActiveAction = 'Update'
          $script:WingetProgressTotal = 2
          $script:WingetProgressDone = 1
          $script:WingetProgressSuccess = 1
          $script:WingetProgressSkipped = 0
          $script:WingetProgressFailed = 0
          $script:WingetCompletedIndexes = @{ 1 = $true }
          $script:ciGuiLog.Clear()
          $firstFinalization = [bool](Complete-WmtUpdateActionFinalization)
          $secondFinalization = [bool](Complete-WmtUpdateActionFinalization)
          if (-not $firstFinalization -or $secondFinalization) {
              throw 'Action finalization was not guarded exactly once.'
          }
          if ($script:WingetProgressDone -ne 2 -or $script:WingetProgressSuccess -ne 1 -or
              $script:WingetProgressFailed -ne 1 -or $script:WingetCompletedIndexes.Count -ne 2) {
              throw 'Action finalization did not reconcile every grouped item exactly once.'
          }
          if (@($script:ciGuiLog | Where-Object { $_ -match '^\[Update\]\[gem\] FAILED' }).Count -ne 1) {
              throw 'Action finalization did not attribute the missing item to its provider.'
          }

          # Execute the production worker with one item whose Id conversion throws.
          # The item fails, and the following item in the same provider still runs.
          $workerAssignment = $ast.Find({
                  param($node)
                  $node -is [System.Management.Automation.Language.AssignmentStatementAst] -and
                  $node.Left -is [System.Management.Automation.Language.VariableExpressionAst] -and
                  $node.Left.VariablePath.UserPath -eq 'wingetWorkerScript'
              }, $true)
          if (-not $workerAssignment) {
              throw 'The production package action worker could not be extracted.'
          }
          # Use the parser's ScriptBlockAst rather than recreating the brace
          # text as a nested scriptblock expression. The latter returns the
          # nested block instead of executing the production worker.
          $workerBlock = $workerAssignment.Right.Expression.ScriptBlock.GetScriptBlock()
          Add-Type -TypeDefinition @'
          using System;
          public class WmtCiThrowingToString {
              public override string ToString() {
                  throw new InvalidOperationException("simulated package item exception");
              }
          }
          '@
          $badActionItem = [pscustomobject]@{
              Source = 'test'
              Id = (New-Object WmtCiThrowingToString)
              Version = '1.0'
              Available = '2.0'
              # Use a non-local global index so a provider-local fallback would
              # collide with another provider's result.
              WmtActionIndex = 2
              ProviderLogFilesEnabled = $false
              ProviderHeadlessEnabled = $false
          }
          $goodActionItem = [pscustomobject]@{
              Source = 'test'
              Name = 'Good Action Item'
              Id = 'good-action-item'
              Version = '1.0'
              Available = '2.0'
              WmtActionIndex = 3
              ProviderLogFilesEnabled = $false
              ProviderHeadlessEnabled = $false
          }
          $actionQueue = [System.Collections.Concurrent.ConcurrentQueue[object]]::new()
          $workerArgs = @{
              Items = [object[]]@($badActionItem, $goodActionItem)
              TotalItems = 3
              ProviderKey = 'test'
              ActionName = 'Update'
              CmdTemplate = ''
              TempPath = $env:TEMP
              PackageInstallLogRoot = $env:TEMP
              WingetIncludeUnknown = $false
              SilentUpdateInstallEnabled = $false
              PythonExePath = 'python.exe'
              LegendaryExePath = ''
              GogdlExePath = ''
              GogdlAuthConfigPath = ''
          }
          & $workerBlock $workerArgs $actionQueue | Out-Null
          $workerLines = @($actionQueue.ToArray())
          if (@($workerLines | Where-Object { [string]$_ -eq 'RESULT:2:FAILED:item 2' }).Count -ne 1 -or
              @($workerLines | Where-Object { [string]$_ -eq 'RESULT:3:SKIPPED:Good Action Item' }).Count -ne 1) {
              throw 'A package item exception did not remain isolated or retain its global action index.'
          }
          if (@($workerLines | Where-Object { [string]$_ -eq 'ACTION_PROVIDER_STARTED:test' }).Count -ne 1) {
              throw 'The production action worker did not emit its provider-start lifecycle signal.'
          }

          # A global pnpm repair must force-reinstall the package's complete
          # isolated global group. `pnpm rebuild` is project-scoped, while a
          # selective `pnpm add -g` can replace the group and remove sibling
          # tools. Execute the production worker against a real group-shaped
          # fixture; the fake pnpm restores package files and global shims only
          # when the complete group is re-added at its installed versions.
          $pnpmGlobalRepairItem = [pscustomobject]@{
              Source = 'pnpm (global)'
              Name = 'Global Pnpm Tool'
              Id = 'global-tool'
              Version = '1.0.0'
              Available = '2.0.0'
              WmtActionIndex = 4
              ProviderLogFilesEnabled = $false
              ProviderHeadlessEnabled = $false
          }
          $pnpmRepairQueue = [System.Collections.Concurrent.ConcurrentQueue[object]]::new()
          $pnpmRepairArgs = @{
              Items = [object[]]@($pnpmGlobalRepairItem)
              TotalItems = 4
              ProviderKey = 'pnpm'
              ActionName = 'Repair'
              CmdTemplate = ''
              TempPath = $env:TEMP
              PackageInstallLogRoot = $env:TEMP
              WingetIncludeUnknown = $false
              SilentUpdateInstallEnabled = $false
              PythonExePath = 'python.exe'
              LegendaryExePath = ''
              GogdlExePath = ''
              GogdlAuthConfigPath = ''
          }
          $pnpmRepairFixtureDir = Join-Path $env:RUNNER_TEMP ('wmt-pnpm-repair-' + [Guid]::NewGuid().ToString('N'))
          $pnpmRepairGroupDir = Join-Path $pnpmRepairFixtureDir 'global\v11\fixture-group'
          $pnpmRepairTargetDir = Join-Path $pnpmRepairGroupDir 'node_modules\global-tool'
          $pnpmRepairSiblingDir = Join-Path $pnpmRepairGroupDir 'node_modules\sibling-tool'
          $pnpmRepairBinDir = Join-Path $pnpmRepairFixtureDir 'bin'
          [void][IO.Directory]::CreateDirectory($pnpmRepairTargetDir)
          [void][IO.Directory]::CreateDirectory($pnpmRepairSiblingDir)
          [void][IO.Directory]::CreateDirectory($pnpmRepairBinDir)
          $oldPnpmRepairPath = $env:PATH
          try {
              [ordered]@{
                  dependencies = [ordered]@{ 'global-tool' = '^1.0.0'; 'sibling-tool' = '^2.0.0' }
              } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $pnpmRepairGroupDir 'package.json') -Encoding UTF8
              [ordered]@{
                  name = 'global-tool'
                  version = '1.0.0'
                  bin = [ordered]@{ 'global-tool' = 'cli.js' }
              } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $pnpmRepairTargetDir 'package.json') -Encoding UTF8
              Set-Content -LiteralPath (Join-Path $pnpmRepairTargetDir 'cli.js') -Value 'DAMAGED' -NoNewline
              [ordered]@{
                  name = 'sibling-tool'
                  version = '2.0.0'
                  bin = [ordered]@{ 'sibling-tool' = 'cli.js' }
              } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $pnpmRepairSiblingDir 'package.json') -Encoding UTF8
              Set-Content -LiteralPath (Join-Path $pnpmRepairSiblingDir 'cli.js') -Value 'SIBLING' -NoNewline
              # The global shims are missing until the group is reinstalled.
              @'
          $ErrorActionPreference = 'Stop'
          $root = $PSScriptRoot
          $group = Join-Path $root 'global\v11\fixture-group'
          $bin = Join-Path $root 'bin'
          $argsText = ($args | ForEach-Object { [string]$_ }) -join ' '
          switch -Regex ($argsText) {
              '^list -g --json --long$' {
                  $dependencies = [ordered]@{}
                  foreach ($name in @('global-tool', 'sibling-tool')) {
                      $dependencies[$name] = [ordered]@{
                          path = (Join-Path (Join-Path $group 'node_modules') $name)
                      }
                  }
                  $payload = [ordered]@{ dependencies = $dependencies } | ConvertTo-Json -Depth 6 -Compress
                  Write-Output ('[' + $payload + ']')
                  exit 0
              }
              '^add -g --force --save-exact (?<selectors>.+)$' {
                  $selectors = @($Matches['selectors'] -split '[,\s]+' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
                  Set-Content -LiteralPath (Join-Path $root 'add-args.txt') -Value ($selectors -join ',') -Encoding Ascii
                  if ($selectors -notcontains 'global-tool@1.0.0' -or $selectors -notcontains 'sibling-tool@2.0.0') {
                      Write-Error "selective global reinstall: $($selectors -join ',')"
                      exit 1
                  }
                  Set-Content -LiteralPath (Join-Path $group 'node_modules\global-tool\cli.js') -Value 'RESTORED' -NoNewline
                  foreach ($name in @('global-tool', 'sibling-tool')) {
                      Set-Content -LiteralPath (Join-Path $bin ($name + '.cmd')) -Value "@echo off`r`nexit /b 0" -Encoding Ascii
                  }
                  exit 0
              }
              '^bin -g$' {
                  Write-Output $bin
                  exit 0
              }
              default {
                  Write-Error "unexpected pnpm arguments: $argsText"
                  exit 1
              }
          }
          '@ | Set-Content -LiteralPath (Join-Path $pnpmRepairFixtureDir 'fake-pnpm.ps1') -Encoding UTF8
                        @'
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0fake-pnpm.ps1" %*
          exit /b %ERRORLEVEL%
          '@ | Set-Content -LiteralPath (Join-Path $pnpmRepairFixtureDir 'pnpm.cmd') -Encoding Ascii
              $env:PATH = $pnpmRepairFixtureDir + ';' + $oldPnpmRepairPath
              & $workerBlock $pnpmRepairArgs $pnpmRepairQueue | Out-Null
              $pnpmRepairLines = @($pnpmRepairQueue.ToArray())
              if (@($pnpmRepairLines | Where-Object { [string]$_ -eq 'RESULT:4:SUCCESS:Global Pnpm Tool' }).Count -ne 1) {
                  throw 'The production global pnpm repair did not complete successfully.'
              }
              $recordedPnpmSelectors = if (Test-Path -LiteralPath (Join-Path $pnpmRepairFixtureDir 'add-args.txt')) {
                  (Get-Content -LiteralPath (Join-Path $pnpmRepairFixtureDir 'add-args.txt') -Raw).Trim()
              }
              else { '' }
              if ($recordedPnpmSelectors -ne 'global-tool@1.0.0,sibling-tool@2.0.0') {
                  throw "Global pnpm repair did not re-add the complete isolated group: '$recordedPnpmSelectors'."
              }
              if ((Get-Content -LiteralPath (Join-Path $pnpmRepairTargetDir 'cli.js') -Raw) -ne 'RESTORED') {
                  throw 'Global pnpm repair did not force-reinstall the damaged package.'
              }
              if (-not (Test-Path -LiteralPath (Join-Path $pnpmRepairSiblingDir 'package.json') -PathType Leaf)) {
                  throw 'Global pnpm repair removed a sibling tool from the isolated group.'
              }
              foreach ($shimName in @('global-tool.cmd', 'sibling-tool.cmd')) {
                  if (-not (Test-Path -LiteralPath (Join-Path $pnpmRepairBinDir $shimName) -PathType Leaf)) {
                      throw "Global pnpm repair did not restore the $shimName global shim."
                  }
              }
          }
          finally {
              $env:PATH = $oldPnpmRepairPath
              Remove-Item -LiteralPath $pnpmRepairFixtureDir -Recurse -Force -ErrorAction SilentlyContinue
          }

          # Missing providers remain enabled by explicit user intent. They fail
          # independently during scans until the user disables or installs them.
          $enabledIntent = @(Get-WmtProviderEnabledIntent `
                  -ProviderDefinitions @(
                      [pscustomobject]@{ Key = 'winget'; LockedOn = $true }
                      [pscustomobject]@{ Key = 'scoop'; LockedOn = $false }
                  ) `
                  -ProviderControls @{ scoop = @{ Main = [pscustomobject]@{ IsChecked = $true } } })
          if ($enabledIntent -notcontains 'winget' -or $enabledIntent -notcontains 'scoop') {
              throw 'Provider intent removed locked Winget or an enabled missing provider.'
          }
          if ($source -notmatch 'Get-WmtProviderEnabledIntent\s+`\r?\n\s*-ProviderDefinitions') {
              throw 'The production Provider settings save does not preserve enabled-provider intent.'
          }
          $scoopStart = $source.IndexOf('# E. SCOOP WORKER')
          $scoopEnd = $source.IndexOf('# F. RUBY GEMS WORKER', $scoopStart)
          if ($scoopStart -lt 0 -or $scoopEnd -le $scoopStart) {
              throw 'The production Scoop worker could not be located.'
          }
          $scoopWorkerSource = $source.Substring($scoopStart, $scoopEnd - $scoopStart)
          if ($scoopWorkerSource -notmatch 'Get-Command scoop' -or
              $scoopWorkerSource -notmatch 'ProviderScanStatus') {
              throw 'A missing Scoop provider is not reported as an attributable scan failure.'
          }

          # Provider-dialog close verification uses the exact registered window
          # and its Closed lifecycle signal; a hidden but still-open modal window
          # is not considered closed.
          if ($source -notmatch '\$providerSettingsUiStates\s*=\s*\$providerSettingsRegistry' -or
              $source -notmatch '\$providerSettingsStateId\s*=\s*\$providerSettingsStateKey') {
              throw 'The Provider Settings completion closures do not explicitly materialize their registry and state ID.'
          }
          $dialogState = @{ Dialog = $null; DialogClosed = $false }
          $dialog = [pscustomobject]@{ IsVisible = $true; CloseCalls = 0 }
          $dialogState.Dialog = $dialog
          $dialog | Add-Member -MemberType ScriptMethod -Name Close -Value ({
                  $this.CloseCalls++
                  $this.IsVisible = $false
                  $dialogState.DialogClosed = $true
              }).GetNewClosure()
          $closeResult = Close-WmtProviderSettingsDialog -Dialog $dialog -State $dialogState
          if (-not $dialogState.DialogClosed -or $dialog.CloseCalls -ne 1 -or
              -not $closeResult.VerifiedClosed -or $closeResult.AlreadyClosed -or
              -not $closeResult.CloseRequested -or -not $closeResult.ClosedEventObserved) {
              throw 'The Provider settings dialog did not close through its exact registered reference.'
          }

          $hiddenState = @{ Dialog = $null; DialogClosed = $false }
          $hiddenDialog = [pscustomobject]@{ IsVisible = $false; CloseCalls = 0 }
          $hiddenState.Dialog = $hiddenDialog
          $hiddenDialog | Add-Member -MemberType ScriptMethod -Name Close -Value ({
                  $this.CloseCalls++
              }).GetNewClosure()
          $hiddenRejected = $false
          try { [void](Close-WmtProviderSettingsDialog -Dialog $hiddenDialog -State $hiddenState) }
          catch { $hiddenRejected = $_.Exception.Message -match 'Closed event' }
          if (-not $hiddenRejected -or $hiddenState.DialogClosed) {
              throw 'A hidden but still-open Provider settings dialog was treated as closed.'
          }

          $failureState = @{ Dialog = $null; DialogClosed = $false }
          $failureDialog = [pscustomobject]@{ IsVisible = $true }
          $failureState.Dialog = $failureDialog
          $failureDialog | Add-Member -MemberType ScriptMethod -Name Close -Value {
              throw 'simulated close failure'
          }
          $closeFailureReported = $false
          try { [void](Close-WmtProviderSettingsDialog -Dialog $failureDialog -State $failureState) }
          catch { $closeFailureReported = $_.Exception.Message -match 'close failed' }
          if (-not $closeFailureReported) {
              throw 'A Provider settings dialog close failure was not surfaced.'
          }

          $wrongState = @{ Dialog = [pscustomobject]@{ IsVisible = $true }; DialogClosed = $false }
          $wrongTarget = [pscustomobject]@{ IsVisible = $true; CloseCalls = 0 }
          $wrongTarget | Add-Member -MemberType ScriptMethod -Name Close -Value {
              $this.CloseCalls++
          }
          $wrongRejected = $false
          try { [void](Close-WmtProviderSettingsDialog -Dialog $wrongTarget -State $wrongState) }
          catch { $wrongRejected = $_.Exception.Message -match 'does not match' }
          if (-not $wrongRejected -or $wrongTarget.CloseCalls -ne 0) {
              throw 'Provider settings close did not enforce the exact registered dialog reference.'
          }

          $unregisteredTarget = [pscustomobject]@{ IsVisible = $true; CloseCalls = 0 }
          $unregisteredTarget | Add-Member -MemberType ScriptMethod -Name Close -Value {
              $this.CloseCalls++
          }
          $unregisteredRejected = $false
          try { [void](Close-WmtProviderSettingsDialog -Dialog $unregisteredTarget -State @{ DialogClosed = $false }) }
          catch { $unregisteredRejected = $_.Exception.Message -match 'registered dialog reference' }
          if (-not $unregisteredRejected -or $unregisteredTarget.CloseCalls -ne 0) {
              throw 'Provider settings close accepted a dialog without a registered reference.'
          }

          # The per-dialog generation and exact registry identity reject stale
          # asynchronous completions without allowing them to mutate a newer
          # Provider Settings window.
          $generationState = New-WmtProviderSettingsUiState `
              -Dialog ([pscustomobject]@{ IsVisible = $true }) `
              -SaveButton $null `
              -StateId 'ci-generation-state'
          $generationRegistry = @{ 'ci-generation-state' = $generationState }
          $generationState.Generation = 2
          if (-not (Test-WmtProviderSettingsOperationCurrent `
                    -State $generationState `
                    -Generation 2 `
                    -StateId 'ci-generation-state' `
                    -Registry $generationRegistry) -or
              (Test-WmtProviderSettingsOperationCurrent `
                    -State $generationState `
                    -Generation 1 `
                    -StateId 'ci-generation-state' `
                    -Registry $generationRegistry)) {
              throw 'Provider settings operation generation validation accepted a stale completion.'
          }
          $generationRegistry['ci-generation-state'] = [pscustomobject]@{ Generation = 2 }
          if (Test-WmtProviderSettingsOperationCurrent `
                    -State $generationState `
                    -Generation 2 `
                    -StateId 'ci-generation-state' `
                    -Registry $generationRegistry) {
              throw 'Provider settings operation validation accepted a replacement state object.'
          }

          # If persistence fails after the modal was closed, its registry entry
          # must not retain the closed window and its closures.
          $errorCallbackCandidates = @($ast.FindAll({
                  param($node)
                  $node -is [System.Management.Automation.Language.ScriptBlockExpressionAst] -and
                      $node.Extent.Text -match 'param\(\$errorRecord\)' -and
                      $node.Extent.Text -match 'Could not save provider settings'
              }, $true) | Sort-Object { $_.Extent.Text.Length })
          if (-not $errorCallbackCandidates -or $errorCallbackCandidates.Count -eq 0) {
              throw 'The production Provider settings save-error callback could not be extracted.'
          }
          $providerSettingsStateId = 'ci-closed-provider-state'
          $providerSettingsState = [pscustomobject]@{
              SavePending = $true
              SettingsPersisted = $false
              CloseRequested = $false
              DialogClosed = $true
              Generation = 1
          }
          $providerSettingsGeneration = 1
          $providerSettingsUiStates = @{ $providerSettingsStateId = $providerSettingsState }
          $providerSettingsSaveButton = $null
          function Show-WmtMessageBox { param($Message, $Title, $Image, $Owner) }
          $errorCallbackScript = $errorCallbackCandidates[0].ScriptBlock.GetScriptBlock()
          & $errorCallbackScript ([pscustomobject]@{
                  Exception = [System.Exception]::new('simulated persistence failure')
              })
          if ($providerSettingsUiStates.ContainsKey($providerSettingsStateId) -or
              $providerSettingsState.SavePending) {
              throw 'A failed save retained a closed Provider settings dialog in the UI-state registry.'
          }

          Write-Host 'PASS: provider startup failures, typed failures, and scan timeouts remain provider-local.'
          Write-Host 'PASS: provider-grouped action timeouts and worker errors do not cancel successful providers.'
          Write-Host 'PASS: one package-item exception does not terminate the remaining items in that provider.'
          Write-Host 'PASS: missing Scoop remains enabled and reports an attributable scan failure.'
          Write-Host 'PASS: Provider Save & Close verifies the exact dialog and Closed lifecycle signal.'

      - name: Smoke test model-ID driver supersedence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          foreach ($name in @('Get-WmtInfModelEntries','Get-WmtInfDeclaredHardwareIds','Get-WmtInfCompatibleModels','Get-WmtDriverPackageGroupKey','Get-WmtUnusedDriverPackageRows','Get-WmtCompatibleDriverPackageNames','Set-DriverRowProperty','Get-DriverDeviceListText','Set-DriverStatusFlags')) {
              $fn = $ast.Find({
                  param($n)
                  $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name
              }, $true)
              if (-not $fn) { throw "Required driver function is missing: $name" }
              Invoke-Expression $fn.Extent.Text
          }
          function Write-GuiLog { param([string]$Message) }
          $cleanup = $ast.Find({
              param($n)
              $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Show-DriverCleanupDialog'
          }, $true)
          if (-not $cleanup -or $cleanup.Extent.Text -notmatch 'Group-Object -Property \{ Get-WmtDriverPackageGroupKey -Driver \$_ \}') {
              throw 'Clean Old Drivers does not share model-ID supersedence grouping.'
          }
          $usageLoad = $ast.Find({
              param($n)
              $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Start-DriverUsageLoad'
          }, $true)
          if (-not $usageLoad -or $usageLoad.Extent.Text -notmatch 'Get-WmtInfDeclaredHardwareIds' -or
              $usageLoad.Extent.Text -notmatch 'DriverModelHardwareIds' -or
              $usageLoad.Extent.Text -notmatch 'ModelIdErrors') {
              throw 'Driver model IDs are not parsed in the background usage scan.'
          }
          $tempRoot = Join-Path $env:TEMP ('wmt-driver-id-' + [Guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($tempRoot)
          try {
              $sameIdInf = Join-Path $tempRoot 'same-id.inf'
              $otherIdInf = Join-Path $tempRoot 'partial-id.inf'
              @'
          [Version]
          Signature="$Windows NT$"
          [Manufacturer]
          %Vendor%=Models,NTamd64.10.0
          [Models.NTamd64.10.0]
          %Model%=Install, SWC\AMDWIN-25.10
          [Strings]
          Vendor="AMD"
          Model="AMD Windows Support"
          '@ | Set-Content -LiteralPath $sameIdInf -Encoding Ascii
              @'
          [Version]
          Signature="$Windows NT$"
          [Manufacturer]
          %Vendor%=Models,NTamd64.10.0
          [Models.NTamd64.10.0]
          %Model%=Install, SWC\AMDWIN-25.10, SWC\OTHER-1.0
          [Strings]
          Vendor="AMD"
          Model="Other component"
          '@ | Set-Content -LiteralPath $otherIdInf -Encoding Ascii
              $modelIds = @(Get-WmtInfDeclaredHardwareIds -InfPath $sameIdInf)
              $otherIds = @(Get-WmtInfDeclaredHardwareIds -InfPath $otherIdInf)
              $models = @(Get-WmtInfCompatibleModels -InfPath $sameIdInf -HardwareIds @('SWC\AMDWIN-25.10'))
              if ($modelIds.Count -ne 1 -or $modelIds[0] -ne 'SWC\AMDWIN-25.10' -or
                  $otherIds.Count -ne 2 -or
                  $models.Count -ne 1 -or $models[0] -ne 'AMD Windows Support') {
                  throw 'INF model-ID parsing or compatible-model matching failed.'
              }
              $rows = @(
                  [PSCustomObject]@{ PublishedName='oem22.inf'; OriginalName='amd-old.inf'; Provider='AMD'; Class='SoftwareComponent'; Version=[Version]'1.5.0.0'; DisplayVer='1.5.0.0'; SortDate=[DateTime]'2026-08-17'; DisplayDate='2026-08-17'; Status='Checking...'; StatusSort='4'; DriverModelHardwareIds=[string[]]$modelIds },
                  [PSCustomObject]@{ PublishedName='oem24.inf'; OriginalName='amd-older.inf'; Provider='AMD'; Class='SoftwareComponent'; Version=[Version]'1.4.0.0'; DisplayVer='1.4.0.0'; SortDate=[DateTime]'2026-05-29'; DisplayDate='2026-05-29'; Status='Checking...'; StatusSort='4'; DriverModelHardwareIds=[string[]]$modelIds },
                  [PSCustomObject]@{ PublishedName='oem41.inf'; OriginalName='amd-current.inf'; Provider='AMD'; Class='SoftwareComponent'; Version=[Version]'2.0.0.0'; DisplayVer='2.0.0.0'; SortDate=[DateTime]'2026-10-16'; DisplayDate='2026-10-16'; Status='Checking...'; StatusSort='4'; DriverModelHardwareIds=[string[]]$modelIds },
                  [PSCustomObject]@{ PublishedName='oem55.inf'; OriginalName='other.inf'; Provider='AMD'; Class='SoftwareComponent'; Version=[Version]'1.0.0.0'; DisplayVer='1.0.0.0'; SortDate=[DateTime]'2026-10-01'; DisplayDate='2026-10-01'; Status='Checking...'; StatusSort='4'; DriverModelHardwareIds=[string[]]$otherIds }
              )
              $script:DriverUsageLoaded = $true
              $script:DriverCacheLoaded = $true
              $script:DriverCacheLoadedAt = Get-Date
              $script:DriverCacheTtlSeconds = 600
              $script:DriverServiceMap = @{}
              $script:DriverDeviceMap = @{ 'oem41.inf' = @([PSCustomObject]@{ Name='AMD Windows Support'; DeviceId='SWC\AMDWIN\INSTANCE'; State='OK'; Code=0 }) }
              $script:DriverPackages = $rows
              Set-DriverStatusFlags
              if ($rows[0].Status -ne 'Old' -or $rows[1].Status -ne 'Old' -or
                  $rows[2].Status -ne 'In Use' -or $rows[3].Status -ne 'Unattached') {
                  throw ("Unexpected driver statuses: " + (@($rows | ForEach-Object { "$($_.PublishedName)=$($_.Status)" }) -join ', '))
              }
              $removeNames = @(Get-WmtCompatibleDriverPackageNames -DriverPackages $rows -NativeCandidates @([PSCustomObject]@{ PublishedName='oem41.inf' }) -DeviceIds @('SWC\AMDWIN-25.10') -CurrentInf 'oem41.inf')
              $unusedRows = @(Get-WmtUnusedDriverPackageRows -PublishedNames $removeNames -CurrentInf 'oem41.inf')
              if ($unusedRows.PublishedName -notcontains 'oem22.inf' -or
                  $unusedRows.PublishedName -notcontains 'oem24.inf' -or
                  $unusedRows.PublishedName -contains 'oem41.inf') {
                  throw 'Compatible unused packages omitted old AMD INFs or included the active INF.'
              }
              Write-Host 'PASS: renamed INF packages are Old; partial ID overlap is not supersedence.'
              Write-Host 'PASS: the picker removal preview finds unused same-ID packages omitted by the native candidate list.'
          } finally {
              Remove-Item -LiteralPath $tempRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test driver-service removal guard
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          $fn = $ast.Find({
              param($n)
              $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $n.Name -eq 'Get-WmtDriverCleanupUsage'
          }, $true)
          if (-not $fn) { throw 'Targeted driver-usage verification is missing.' }
          Invoke-Expression $fn.Extent.Text
          # Avoid driver-store mutations. Mock the CIM and INF reads but leave
          # the real read-only SYSTEM\CurrentControlSet\Services registry check.
          function Get-CimInstance {
              [CmdletBinding()]
              param([string]$ClassName, [string]$Property, [string]$Filter, [int]$OperationTimeoutSec)
              [PSCustomObject]@{ InfName = 'oem17.inf' }
          }
          function Test-Path {
              [CmdletBinding()]
              param([string]$LiteralPath, [string]$PathType)
              return $true
          }
          function Get-Content {
              [CmdletBinding()]
              param([string]$LiteralPath)
              'AddService = Tcpip, 0x00000002, Tcpip_Service'
          }
          $usage = Get-WmtDriverCleanupUsage -PublishedName 'oem17.inf'
          if (-not $usage.Succeeded -or
              $usage.InUseInfs -notcontains 'oem17.inf' -or
              $usage.RegisteredServices -notcontains 'Tcpip') {
              throw 'Registered Windows service was not detected during targeted cleanup verification.'
          }
          function Get-Content {
              [CmdletBinding()]
              param([string]$LiteralPath)
              'AddService = ,2'
          }
          $nullDriver = Get-WmtDriverCleanupUsage -PublishedName 'oem17.inf'
          if (-not $nullDriver.Succeeded -or
              $nullDriver.InUseInfs -notcontains 'oem17.inf' -or
              $nullDriver.RegisteredServices.Count -ne 0) {
              throw 'The NULL driver declaration was treated as an unresolved service or lost device-use protection.'
          }
          function Get-Content {
              [CmdletBinding()]
              param([string]$LiteralPath)
              'AddService = %UnresolvedSvcName%, 0x2, UnknownService'
          }
          $rejected = $false
          try { $null = Get-WmtDriverCleanupUsage -PublishedName 'oem17.inf' } catch { $rejected = $true }
          if (-not $rejected) { throw 'An unresolved AddService name was treated as safe.' }
          function Test-Path {
              [CmdletBinding()]
              param([string]$LiteralPath, [string]$PathType)
              return $false
          }
          $rejected = $false
          try { $null = Get-WmtDriverCleanupUsage -PublishedName 'oem17.inf' } catch { $rejected = $true }
          if (-not $rejected) { throw 'A missing INF was treated as safe.' }
          Write-Host 'PASS: active services protected; NULL drivers recognized; unresolved and missing INF identities fail closed.'

      - name: Smoke test driver usage worker fails on incomplete service inventory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          $fn = $ast.Find({
              param($n)
              $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Start-DriverUsageLoad'
          }, $true)
          if (-not $fn) { throw 'Driver usage loader is missing.' }
          $workerMatch = [regex]::Match($fn.Extent.Text, '(?s)\$usageWorker\s*=\s*@''\r?\n(.*?)\r?\n''@')
          if (-not $workerMatch.Success) { throw 'Could not extract driver usage worker.' }
          foreach ($helperName in @('Get-WmtInfModelEntries','Get-WmtInfDeclaredHardwareIds')) {
              $helper = $ast.Find({
                  param($n)
                  $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $helperName
              }, $true)
              if (-not $helper) { throw "Required model-ID helper is missing: $helperName" }
              Invoke-Expression $helper.Extent.Text
          }
          $modelEntriesBody = ${function:Get-WmtInfModelEntries}.ToString()
          $declaredHardwareIdsBody = ${function:Get-WmtInfDeclaredHardwareIds}.ToString()
          $modelIdHelpers = "function Get-WmtInfModelEntries {`r`n$modelEntriesBody`r`n}`r`nfunction Get-WmtInfDeclaredHardwareIds {`r`n$declaredHardwareIdsBody`r`n}"
          $workerSource = $workerMatch.Groups[1].Value.Replace('__MODEL_ID_HELPERS__', $modelIdHelpers)
          $worker = [scriptblock]::Create($workerSource)
          function Get-CimInstance {
              [CmdletBinding()]
              param([string]$ClassName, [string[]]$Property)
              if ($ClassName -eq 'Win32_SystemDriver') { throw 'Simulated service inventory failure' }
          }
          $result = & $worker @('oem5.inf') @{}
          if (-not $result -or $result.Success -or $result.Error -notmatch 'Simulated service inventory failure') {
              throw 'Incomplete service inventory was accepted as verified.'
          }
          Write-Host 'PASS: background driver usage rejects incomplete service inventory.'
          # The same worker must keep unparseable AddService identities UNKNOWN,
          # not silently treat them as zero registered services (or fail all INFs).
          function Get-CimInstance {
              [CmdletBinding()]
              param([string]$ClassName, [string[]]$Property)
          }
          function Test-Path {
              [CmdletBinding()]
              param([string]$LiteralPath, [string]$PathType)
              return $true
          }
          function Get-Item {
              [CmdletBinding()]
              param([string]$LiteralPath)
              [PSCustomObject]@{ LastWriteTimeUtc = [DateTime]::UtcNow }
          }
          function Get-Content {
              [CmdletBinding()]
              param([string]$LiteralPath)
              'AddService = ,2'
          }
          $nullDriver = & $worker @('oem5.inf') @{}
          if (-not $nullDriver.Success -or
              $nullDriver.Services.ContainsKey('oem5.inf') -or
              -not $nullDriver.InfServiceCache['oem5.inf'].Verified) {
              throw 'A NULL driver declaration was marked as an unresolved service.'
          }
          $unusedFunction = $ast.Find({
              param($n)
              $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $n.Name -eq 'Get-WmtUnusedDriverPackageRows'
          }, $true)
          if (-not $unusedFunction) { throw 'Unused driver candidate verification is missing.' }
          Invoke-Expression $unusedFunction.Extent.Text
          $script:DriverUsageLoaded = $true
          $script:DriverDeviceMap = @{}
          $script:DriverServiceMap = $nullDriver.Services
          $script:DriverCacheLoaded = $true
          $script:DriverCacheLoadedAt = Get-Date
          $script:DriverCacheTtlSeconds = 600
          $script:DriverPackages = @([PSCustomObject]@{ PublishedName = 'oem5.inf'; Status = 'Unattached' })
          $unused = @(Get-WmtUnusedDriverPackageRows -PublishedNames @('oem5.inf') -CurrentInf 'oem41.inf')
          if ($unused.Count -ne 1 -or $unused[0].PublishedName -ne 'oem5.inf') {
              throw 'A NULL-driver package with no device or service binding was not eligible for the unused-package preview.'
          }
          Write-Host 'PASS: NULL-driver packages with no device or service binding are offered as unused.'
          function Get-Content {
              [CmdletBinding()]
              param([string]$LiteralPath)
              'AddService = %UnresolvedSvc%, 0x2, ServiceSection'
          }
          $uncertain = & $worker @('oem5.inf') @{}
          if (-not $uncertain.Success -or
              -not $uncertain.Services.ContainsKey('oem5.inf') -or
              -not @($uncertain.Services['oem5.inf'])[0].Unverified -or
              @($uncertain.Services['oem5.inf'])[0].Running) {
              throw 'Unparseable AddService identity did not remain explicitly unverified.'
          }
          # Verify cached parse-confidence survives a repeat read.
          $cache = $uncertain.InfServiceCache
          $uncertainAgain = & $worker @('oem5.inf') $cache
          if (-not $uncertainAgain.Success -or
              -not @($uncertainAgain.Services['oem5.inf'])[0].Unverified) {
              throw 'Service parse cache incorrectly marked unverified INF as safe.'
          }
          Write-Host 'PASS: unknown AddService names remain protected on fresh and cached scans.'

      - name: Smoke test enabling unattached drivers on compatible devices
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          $fn = $ast.Find({
              param($n)
              $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                  $n.Name -eq 'Get-DriverCompatibleDeviceTargets'
          }, $true)
          if (-not $fn) { throw 'Compatible-device discovery for unattached drivers is missing.' }
          Invoke-Expression $fn.Extent.Text
          function Test-Path {
              [CmdletBinding()]
              param([string]$LiteralPath, [string]$PathType)
              return $true
          }
          function Get-WmtDeviceCompatibleIds {
              param([string]$DeviceId)
              @{ HardwareIDs = @('SWC\AMDWIN-25.10'); CompatibleIDs = @() }
          }
          function Get-WmtInfCompatibleModels {
              param([string]$InfPath, [string[]]$HardwareIds, [string[]]$CompatibleIds)
              if ($HardwareIds -contains 'SWC\AMDWIN-25.10') { return @('AMD-Windows Support Components') }
              return @()
          }
          $device = [PSCustomObject]@{ DeviceId = 'SWC\AMDWIN\INSTANCE'; Name = 'AMD-Windows Support Components'; State = 'OK' }
          $script:DriverUsageLoaded = $true
          $script:DriverCacheLoadedAt = Get-Date
          $script:DriverCacheTtlSeconds = 600
          $script:DriverPackages = @(
              [PSCustomObject]@{ PublishedName = 'oem41.inf'; Status = 'In Use' },
              [PSCustomObject]@{ PublishedName = 'oem22.inf'; Status = 'Unattached' }
          )
          $script:DriverDeviceMap = @{ 'oem41.inf' = @($device) }
          $targets = @(Get-DriverCompatibleDeviceTargets -Row $script:DriverPackages[1])
          if ($targets.Count -ne 1 -or
              $targets[0].DeviceId -ne $device.DeviceId -or
              $targets[0].CurrentInf -ne 'oem41.inf') {
              throw 'The unattached package did not discover its currently bound compatible device.'
          }
          $device.State = 'Problem'
          if (@(Get-DriverCompatibleDeviceTargets -Row $script:DriverPackages[1]).Count -ne 0) {
              throw 'A non-running device was offered for package activation.'
          }
          $script:DriverCacheLoadedAt = (Get-Date).AddMinutes(-20)
          $rejected = $false
          try { $null = Get-DriverCompatibleDeviceTargets -Row $script:DriverPackages[1] } catch { $rejected = $true }
          if (-not $rejected) { throw 'Stale usage data was accepted for package activation.' }
          Write-Host 'PASS: unattached package activation requires a compatible running device and fresh usage data.'

      - name: Smoke test fast ghost-device scan and full-width dialog
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = [IO.File]::ReadAllText((Resolve-Path '.\WMT-GUI.ps1').Path)
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors.Message -join '; ') }
          $fn = $ast.Find({
              param($n)
              $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Get-WmtGhostDeviceCandidates'
          }, $true)
          if (-not $fn) { throw 'Fast ghost-device candidate helper is missing.' }
          Invoke-Expression $fn.Extent.Text
          function Get-PnpDevice {
              [CmdletBinding()]
              param()
              [PSCustomObject]@{ Status = 'Unknown'; InstanceId = 'USB\GHOST'; Class = 'USB'; FriendlyName = 'Unplugged test device' }
              [PSCustomObject]@{ Status = 'OK'; InstanceId = 'USB\CONNECTED'; Class = 'USB'; FriendlyName = 'Present test device' }
              [PSCustomObject]@{ Status = 'Unknown'; InstanceId = 'USB\GHOST'; Class = 'USB'; FriendlyName = 'Duplicate ghost' }
              [PSCustomObject]@{ Status = 'Unknown'; InstanceId = ''; Class = 'USB'; FriendlyName = 'Invalid ghost' }
          }
          $rows = @(Get-WmtGhostDeviceCandidates)
          if ($rows.Count -ne 1 -or [string]$rows[0].InstanceId -ne 'USB\GHOST') {
              throw ('Fast ghost candidate scan returned unexpected rows: ' + ($rows | ConvertTo-Json -Compress))
          }
          $dialogText = [regex]::Match($source, '(?ms)^function Show-GhostDevicesDialog\s*\{(.*?)(?=^function Invoke-DriverUpdates)')
          if (-not $dialogText.Success) { throw 'Ghost-device dialog definition missing.' }
          if ($dialogText.Value -notmatch '(?s)\$content\s*=\s*@"\r?\n<Grid>\r?\n') {
              throw 'Ghost-device dialog no longer has an edge-to-edge root grid.'
          }
          if ($dialogText.Value -notmatch 'BorderThickness="0"' -or $dialogText.Value -notmatch 'BorderThickness="0,1,0,0"') {
              throw 'Ghost-device full-width data grid/footer layout regressed.'
          }
          if ($dialogText.Value -match 'WmtGhostScan_|\$ghostScanScript|Starting disconnected.device scan') {
              throw 'Broken child scanner was reintroduced in the ghost dialog.'
          }
          if ($dialogText.Value -notmatch 'Get-PnpDevice -ErrorAction Stop' -or
              $dialogText.Value -notmatch 'GhostDeviceScan_' -or
              $dialogText.Value -notmatch 'Get-PnpDevice -PresentOnly -ErrorAction Stop') {
              throw 'Fast scanning or pre-removal connected-device verification missing.'
          }
          $themedHeaderBands = [regex]::Matches($source,
              '<ControlTemplate TargetType="\{x:Type (?:GridViewColumnHeader|DataGridColumnHeader)\}">\s*<Grid Background="\{DynamicResource BgPanel\}">')
          $transparentFillers = [regex]::Matches($source,
              '<Setter TargetName="HeaderBorder" Property="Background" Value="Transparent"/>')
          if ($themedHeaderBands.Count -ne 2 -or $transparentFillers.Count -lt 2) {
              throw 'Full-width themed header bands or transparent fillers regressed.'
          }
          Write-Host 'PASS: fast ghost candidates, deduplication, edge-to-edge dialog, removal presence guard, and themed headers.'

