              param([switch]$Online, [string]$FeatureName, [switch]$All, [switch]$NoRestart)
              $script:MockEnabledFeature = $FeatureName
          }
          function Disable-WindowsOptionalFeature {
              [CmdletBinding()]
              param([switch]$Online, [string]$FeatureName, [switch]$NoRestart)
              $script:MockDisabledFeature = $FeatureName
          }
          function Invoke-WmtUiBackgroundCommand {
              param(
                  [scriptblock]$Sb,
                  [object[]]$ArgumentList = @(),
                  [string]$Name = '',
                  [string]$Msg = '',
                  [scriptblock]$OnComplete
              )
              & $Sb @ArgumentList
          }
          Switch-WindowsFeature 'XpsViewer' 'XPS Viewer'
          if ($script:MockRemovedCapability -ne 'XPS.Viewer~~~~0.0.1.0' -or $script:MockAddedCapability) {
