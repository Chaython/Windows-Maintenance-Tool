          }
          $script:MockCapabilityState = 'UninstallPending'
          $script:OptionalFeatureStateCache['btnFeatXPS'] = $false
          $script:MockRemovedCapability = ''
          $script:MockAddedCapability = ''
          Switch-WindowsFeature 'XpsViewer' 'XPS Viewer'
          if ($script:MockAddedCapability -ne 'XPS.Viewer~~~~0.0.1.0' -or $script:MockRemovedCapability) {
              throw 'UninstallPending did not dispatch the install action.'
          }
          $script:MockCapabilityState = 'SomethingNew'
          $script:MockRemovedCapability = ''
          $script:MockAddedCapability = ''
          Switch-WindowsFeature 'XpsViewer' 'XPS Viewer'
          if ($script:MockRemovedCapability -or $script:MockAddedCapability) {
              throw 'An unknown capability state changed the system.'
          }
          $script:MockFeatureState = 'EnablePending'
          $script:MockDisabledFeature = ''
          $script:MockEnabledFeature = ''
          Switch-WindowsFeature 'Microsoft-Hyper-V-All' 'Microsoft Hyper-V'
          if ($script:MockDisabledFeature -ne 'Microsoft-Hyper-V-All' -or $script:MockEnabledFeature) {
