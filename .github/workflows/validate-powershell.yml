          }
          # The servicing-state maps are shared by the scan and the toggle.
          Invoke-Expression (Find-FunctionText 'Get-WmtCapabilityStateInfo')
          Invoke-Expression (Find-FunctionText 'Get-WmtOptionalFeatureStateInfo')
          $capabilityExpectations = @(
              @{ State = 'Installed'; Known = $true; Enabled = $true; Pending = ''; Action = 'Remove' },
              @{ State = 'NotPresent'; Known = $true; Enabled = $false; Pending = ''; Action = 'Install' },
              @{ State = 'Staged'; Known = $true; Enabled = $false; Pending = ''; Action = 'Install' },
              @{ State = 'Resolved'; Known = $true; Enabled = $false; Pending = ''; Action = 'Install' },
              @{ State = 'Removed'; Known = $true; Enabled = $false; Pending = ''; Action = 'Install' },
              @{ State = 'InstallPending'; Known = $true; Enabled = $true; Pending = 'InstallPending'; Action = 'Remove' },
              @{ State = 'UninstallPending'; Known = $true; Enabled = $false; Pending = 'UninstallPending'; Action = 'Install' },
              @{ State = 'Superseded'; Known = $true; Enabled = $false; Pending = ''; Action = '' },
              @{ State = 'PartiallyInstalled'; Known = $true; Enabled = $false; Pending = ''; Action = '' },
              @{ State = 'SomethingNew'; Known = $false; Enabled = $false; Pending = ''; Action = '' },
              @{ State = ' Installed '; Known = $true; Enabled = $true; Pending = ''; Action = 'Remove' }
          )
          foreach ($case in $capabilityExpectations) {
              $info = Get-WmtCapabilityStateInfo -State $case.State
              if (-not $info -or $info.Known -ne $case.Known -or
                  $info.Enabled -ne $case.Enabled -or $info.Pending -ne $case.Pending -or
                  $info.Action -ne $case.Action) {
                  throw "Capability state '$($case.State)' was mapped incorrectly."
              }
          }
          $featureExpectations = @(
              @{ State = 'Enabled'; Known = $true; Enabled = $true; Pending = ''; Action = 'Disable' },
              @{ State = 'EnablePending'; Known = $true; Enabled = $true; Pending = 'EnablePending'; Action = 'Disable' },
              @{ State = 'Enable Pending'; Known = $true; Enabled = $true; Pending = 'EnablePending'; Action = 'Disable' },
              @{ State = 'Disabled'; Known = $true; Enabled = $false; Pending = ''; Action = 'Enable' },
              @{ State = 'DisablePending'; Known = $true; Enabled = $false; Pending = 'DisablePending'; Action = 'Enable' },
              @{ State = 'Disable Pending'; Known = $true; Enabled = $false; Pending = 'DisablePending'; Action = 'Enable' },
              @{ State = 'DisabledWithPayloadRemoved'; Known = $true; Enabled = $false; Pending = ''; Action = 'Enable' },
              @{ State = 'Disabled with Payload Removed'; Known = $true; Enabled = $false; Pending = ''; Action = 'Enable' },
              @{ State = 'Superseded'; Known = $true; Enabled = $false; Pending = ''; Action = '' },
              @{ State = 'PartiallyInstalled'; Known = $true; Enabled = $false; Pending = ''; Action = '' },
              @{ State = 'SomethingNew'; Known = $false; Enabled = $false; Pending = ''; Action = '' },
              @{ State = ' enabled '; Known = $true; Enabled = $true; Pending = ''; Action = 'Disable' }
          )
          foreach ($case in $featureExpectations) {
              $info = Get-WmtOptionalFeatureStateInfo -State $case.State
              if (-not $info -or $info.Known -ne $case.Known -or
                  $info.Enabled -ne $case.Enabled -or $info.Pending -ne $case.Pending -or
                  $info.Action -ne $case.Action) {
                  throw "Optional-feature state '$($case.State)' was mapped incorrectly."
              }
          }
          Write-Host 'PASS: every documented feature and capability state maps safely.'

          # Exercise the real toggle workers with mocked servicing cmdlets.
          # Pending states dispatch the reversing action; unknown states are inert.
          Invoke-Expression (Find-FunctionText 'Switch-WindowsFeature')
          $script:OptionalFeaturesMap = @{
              'XpsViewer' = 'btnFeatXPS'
              'Microsoft-Hyper-V-All' = 'btnFeatHyperV'
          }
          $script:OptionalFeaturesReady = $true
          $script:OptionalFeatureStateCache = @{
              'btnFeatXPS' = $true
              'btnFeatHyperV' = $true
          }
          $script:OptionalFeatureProviderCache = @{
              'btnFeatXPS' = @{ Type = 'Capability'; Name = 'XPS.Viewer~~~~0.0.1.0' }
              'btnFeatHyperV' = @{ Type = 'Feature'; Name = 'Microsoft-Hyper-V-All' }
